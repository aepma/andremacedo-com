<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Touchstone — experiment 001</title><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&family=EB+Garamond:ital@0;1&family=JetBrains+Mono:wght@400&display=swap');*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0807;color:#e2d8c8;font-family:'EB Garamond',serif;overflow:hidden;height:100vh;width:100vw;cursor:crosshair;user-select:none}#info{position:fixed;top:20px;left:24px;z-index:10;max-width:320px}#info h1{font-family:'Instrument Serif',serif;font-size:1.4rem;font-weight:400;margin-bottom:0.5rem;color:#d4845a}#info p{font-size:0.85rem;line-height:1.5;opacity:0.6}#info .mono{font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.05em;text-transform:uppercase;color:#a0522d;opacity:0.5;margin-top:1rem}#result{position:fixed;bottom:24px;right:24px;font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:#a0522d;opacity:0;transition:opacity 0.8s;text-align:right;z-index:10}#back{position:fixed;bottom:24px;left:24px;font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:#a0522d;opacity:0.3;text-decoration:none;z-index:10;transition:opacity 0.3s}#back:hover{opacity:0.8}canvas{display:block}</style></head><body><div id='info'><h1>Touchstone</h1><p>Drag across the dark surface to leave a streak. The color of the streak reveals what the sample is made of. Gold leaves a warm trail. Silver is cooler. Copper burns orange. Base metals leave grey.</p><p class='mono'>experiment 001 · andremacedo.com</p></div><div id='result'></div><a id='back' href='/'>← return</a><canvas id='c'></canvas><script>!function(){const c=document.getElementById('c');const ctx=c.getContext('2d');const result=document.getElementById('result');let w,h;function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;ctx.fillStyle='#0a0807';ctx.fillRect(0,0,w,h)}resize();window.addEventListener('resize',resize);const metals=[{name:'Gold (Au)',hue:42,sat:75,lit:58,purity:0.999},{name:'Electrum',hue:48,sat:50,lit:52,purity:0.72},{name:'Silver (Ag)',hue:210,sat:12,lit:70,purity:0.95},{name:'Copper (Cu)',hue:18,sat:70,lit:48,purity:0.88},{name:'Bronze',hue:28,sat:45,lit:40,purity:0.65},{name:'Lead (Pb)',hue:0,sat:0,lit:35,purity:0.15},{name:'Tin (Sn)',hue:200,sat:5,lit:55,purity:0.42},{name:'Iron (Fe)',hue:15,sat:8,lit:28,purity:0.30}];let currentMetal=metals[Math.floor(Math.random()*metals.length)];let drawing=false;let streakLength=0;let lastX=0,lastY=0;function newSample(){currentMetal=metals[Math.floor(Math.random()*metals.length)];streakLength=0;result.style.opacity='0';setTimeout(()=>{result.textContent='new sample loaded';result.style.opacity='0.3';setTimeout(()=>{result.style.opacity='0'},2000)},500)}c.addEventListener('mousedown',e=>{drawing=true;lastX=e.clientX;lastY=e.clientY;streakLength=0});c.addEventListener('mousemove',e=>{if(!drawing)return;const x=e.clientX,y=e.clientY;const dist=Math.hypot(x-lastX,y-lastY);streakLength+=dist;ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);const jitter=Math.random()*4-2;const widthBase=2+Math.min(streakLength/200,6);ctx.lineWidth=widthBase+jitter*0.5;const litVar=currentMetal.lit+Math.random()*10-5;const alpha=0.3+Math.min(streakLength/500,0.5);ctx.strokeStyle='hsla('+currentMetal.hue+','+currentMetal.sat+'%,'+litVar+'%,'+alpha+')';ctx.lineCap='round';ctx.stroke();if(Math.random()<0.15){const sx=x+Math.random()*8-4;const sy=y+Math.random()*8-4;ctx.beginPath();ctx.arc(sx,sy,Math.random()*1.5,0,Math.PI*2);ctx.fillStyle='hsla('+currentMetal.hue+','+currentMetal.sat+'%,'+(litVar+15)+'%,'+(alpha*0.5)+')';ctx.fill()}lastX=x;lastY=y});c.addEventListener('mouseup',()=>{drawing=false;if(streakLength>50){result.innerHTML=currentMetal.name+'<br>purity: '+(currentMetal.purity*100).toFixed(1)+'%<br>streak length: '+Math.floor(streakLength)+'px';result.style.opacity='0.7';setTimeout(()=>{newSample()},4000)}});c.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];drawing=true;lastX=t.clientX;lastY=t.clientY;streakLength=0},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const t=e.touches[0];const x=t.clientX,y=t.clientY;const dist=Math.hypot(x-lastX,y-lastY);streakLength+=dist;ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);const widthBase=2+Math.min(streakLength/200,6);ctx.lineWidth=widthBase;const litVar=currentMetal.lit+Math.random()*10-5;const alpha=0.3+Math.min(streakLength/500,0.5);ctx.strokeStyle='hsla('+currentMetal.hue+','+currentMetal.sat+'%,'+litVar+'%,'+alpha+')';ctx.lineCap='round';ctx.stroke();lastX=x;lastY=y},{passive:false});c.addEventListener('touchend',()=>{drawing=false;if(streakLength>50){result.innerHTML=currentMetal.name+'<br>purity: '+(currentMetal.purity*100).toFixed(1)+'%<br>streak length: '+Math.floor(streakLength)+'px';result.style.opacity='0.7';setTimeout(()=>{newSample()},4000)}});let fadeInterval=setInterval(()=>{ctx.fillStyle='rgba(10,8,7,0.003)';ctx.fillRect(0,0,w,h)},100);newSample()}()</script></body></html>

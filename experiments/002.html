<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>002 — boids</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#030807;overflow:hidden;cursor:crosshair;font-family:'JetBrains Mono',monospace}canvas{display:block}#controls{position:fixed;bottom:24px;left:28px;z-index:10;color:#5a7a6d;font-size:10px;opacity:0.5;line-height:2}#controls label{display:block}#controls input[type=range]{width:120px;opacity:0.5;vertical-align:middle;accent-color:#3de8c5}#title{position:fixed;top:24px;left:28px;z-index:10;font-family:'Instrument Serif',serif;color:#d0e8e0;font-size:16px;opacity:0.7}#title span{font-family:'JetBrains Mono',monospace;font-size:10px;color:#5a7a6d;display:block;margin-top:4px}#back{position:fixed;top:24px;right:28px;z-index:10;font-size:10px;color:#5a7a6d;text-decoration:none;opacity:0.4;font-family:'JetBrains Mono',monospace}#back:hover{opacity:0.8}#count{position:fixed;bottom:24px;right:28px;z-index:10;font-size:9px;color:#5a7a6d;opacity:0.3}</style><link href='https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@300&display=swap' rel='stylesheet'></head><body><div id='title'>Boids<span>separation · alignment · cohesion</span></div><a id='back' href='/'>← back</a><div id='controls'><label>separation <input type='range' id='sep' min='0' max='3' step='0.1' value='1.5'></label><label>alignment <input type='range' id='ali' min='0' max='3' step='0.1' value='1.0'></label><label>cohesion <input type='range' id='coh' min='0' max='3' step='0.1' value='1.0'></label></div><div id='count'></div><canvas id='c'></canvas><script>const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}resize();addEventListener('resize',resize);const N=300,boids=[];const sepEl=document.getElementById('sep'),aliEl=document.getElementById('ali'),cohEl=document.getElementById('coh');const countEl=document.getElementById('count');let mx=-1000,my=-1000;addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});addEventListener('mouseleave',()=>{mx=-1000;my=-1000});for(let i=0;i<N;i++){boids.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2})}function step(){const sep=parseFloat(sepEl.value),ali=parseFloat(aliEl.value),coh=parseFloat(cohEl.value);const maxSpeed=3,maxForce=0.05,perception=50;for(let i=0;i<N;i++){const b=boids[i];let sx=0,sy=0,sc=0;let ax=0,ay=0,ac=0;let cx=0,cy=0,cc=0;for(let j=0;j<N;j++){if(i===j)continue;const dx=boids[j].x-b.x,dy=boids[j].y-b.y;const d=Math.sqrt(dx*dx+dy*dy);if(d<perception&&d>0){if(d<25){sx-=dx/d;sy-=dy/d;sc++}ax+=boids[j].vx;ay+=boids[j].vy;ac++;cx+=boids[j].x;cy+=boids[j].y;cc++}}if(sc>0){sx/=sc;sy/=sc;const m=Math.sqrt(sx*sx+sy*sy)||1;sx=sx/m*maxSpeed-b.vx;sy=sy/m*maxSpeed-b.vy;const fm=Math.sqrt(sx*sx+sy*sy);if(fm>maxForce){sx=sx/fm*maxForce;sy=sy/fm*maxForce}}if(ac>0){ax/=ac;ay/=ac;const m=Math.sqrt(ax*ax+ay*ay)||1;ax=ax/m*maxSpeed-b.vx;ay=ay/m*maxSpeed-b.vy;const fm=Math.sqrt(ax*ax+ay*ay);if(fm>maxForce){ax=ax/fm*maxForce;ay=ay/fm*maxForce}}if(cc>0){cx=cx/cc-b.x;cy=cy/cc-b.y;const m=Math.sqrt(cx*cx+cy*cy)||1;cx=cx/m*maxSpeed-b.vx;cy=cy/m*maxSpeed-b.vy;const fm=Math.sqrt(cx*cx+cy*cy);if(fm>maxForce){cx=cx/fm*maxForce;cy=cy/fm*maxForce}}b.vx+=sx*sep+ax*ali+cx*coh;b.vy+=sy*sep+ay*ali+cy*coh;const md=Math.sqrt(mx*mx>=0?(mx-b.x)*(mx-b.x)+(my-b.y)*(my-b.y):1e6);if(md<120&&md>0){const repX=(b.x-mx)/md*0.3;const repY=(b.y-my)/md*0.3;b.vx+=repX;b.vy+=repY}const speed=Math.sqrt(b.vx*b.vx+b.vy*b.vy);if(speed>maxSpeed){b.vx=b.vx/speed*maxSpeed;b.vy=b.vy/speed*maxSpeed}b.x+=b.vx;b.y+=b.vy;if(b.x<0)b.x+=W;if(b.x>W)b.x-=W;if(b.y<0)b.y+=H;if(b.y>H)b.y-=H}}function draw(){ctx.fillStyle='rgba(3,8,7,0.15)';ctx.fillRect(0,0,W,H);for(const b of boids){const angle=Math.atan2(b.vy,b.vx);const speed=Math.sqrt(b.vx*b.vx+b.vy*b.vy);const alpha=0.3+speed/3*0.5;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(angle);ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(-3,2);ctx.lineTo(-3,-2);ctx.closePath();ctx.fillStyle='rgba(61,232,197,'+alpha.toFixed(2)+')';ctx.fill();ctx.restore()}countEl.textContent=N+' boids · sep '+sepEl.value+' · ali '+aliEl.value+' · coh '+cohEl.value}function loop(){step();draw();requestAnimationFrame(loop)}loop();</script></body></html>

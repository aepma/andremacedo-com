<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>006: Meridian — andremacedo.com</title><style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=JetBrains+Mono:wght@300&display=swap');*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f0e6;overflow:hidden;cursor:crosshair}canvas{display:block}#info{position:fixed;top:24px;left:24px;font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:#7a7068;letter-spacing:0.1em;text-transform:uppercase;opacity:0.6;line-height:1.8}#title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Playfair Display',serif;font-size:clamp(1.5rem,4vw,3rem);color:#1a1612;pointer-events:none;opacity:0.08;text-align:center}#back{position:fixed;bottom:24px;left:24px;font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:#d4760a;text-decoration:none;letter-spacing:0.12em;text-transform:uppercase;opacity:0.5;transition:opacity 0.3s}#back:hover{opacity:1}</style></head><body><canvas id="c"></canvas><div id="info">006: Meridian<br>Click to place division lines<br>Particles split between light and dark</div><div id="title">Where do you draw the line?</div><a id="back" href="/">← return</a><script>(function(){const c=document.getElementById('c'),ctx=c.getContext('2d');let w=c.width=innerWidth,h=c.height=innerHeight;const meridians=[];const particles=[];const N=400;for(let i=0;i<N;i++){particles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*1.2,vy:(Math.random()-0.5)*1.2,r:Math.random()*2+0.5});}c.addEventListener('click',function(e){meridians.push({x:e.clientX,age:0});if(meridians.length>8)meridians.shift();});window.addEventListener('resize',function(){w=c.width=innerWidth;h=c.height=innerHeight;});function getSide(px){let side=0;for(const m of meridians){if(px>m.x)side++;}return side%2;}function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#f5f0e6';ctx.fillRect(0,0,w,h);for(const m of meridians){m.age++;const alpha=Math.min(m.age/60,1)*0.15;ctx.strokeStyle='rgba(212,118,10,'+alpha+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(m.x,0);ctx.lineTo(m.x,h);ctx.stroke();}for(const m of meridians){const rightX=m.x;ctx.fillStyle='rgba(10,10,10,0.04)';for(let i=0;i<3;i++){ctx.fillRect(rightX,0,w-rightX,h);}}for(const p of particles){const side=getSide(p.x);const dark=side%2===1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);if(dark){ctx.fillStyle='rgba(245,240,230,'+((0.3+Math.random()*0.3))+')';} else {ctx.fillStyle='rgba(26,22,18,'+((0.2+Math.random()*0.2))+')';}ctx.fill();p.x+=p.vx;p.y+=p.vy;p.vx+=(Math.random()-0.5)*0.08;p.vy+=(Math.random()-0.5)*0.08;p.vx*=0.99;p.vy*=0.99;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;}requestAnimationFrame(draw);}draw();})();</script></body></html>

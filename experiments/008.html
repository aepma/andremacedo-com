<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>008 — Meridian Clock</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a12;overflow:hidden;font-family:'Helvetica Neue',sans-serif}canvas{display:block}#info{position:fixed;top:20px;left:20px;color:rgba(255,255,245,0.7);font-size:13px;line-height:1.6;max-width:320px;z-index:10;text-shadow:0 0 8px rgba(0,0,0,0.8),0 0 20px rgba(0,0,0,0.5)}#info h1{font-size:18px;font-weight:700;color:#22d3ee;margin-bottom:6px}#info p{margin-bottom:8px;color:rgba(255,255,245,0.55)}#back{position:fixed;bottom:20px;left:20px;color:rgba(255,255,245,0.4);font-size:12px;text-decoration:none;z-index:10;text-shadow:0 0 8px rgba(0,0,0,0.8),0 0 20px rgba(0,0,0,0.5)}#back:hover{color:#22d3ee}#clock-readout{position:fixed;bottom:20px;right:20px;color:rgba(255,255,245,0.4);font-size:11px;font-family:monospace;z-index:10;text-align:right;text-shadow:0 0 8px rgba(0,0,0,0.8),0 0 20px rgba(0,0,0,0.5)}</style></head><body><div id="info"><h1>008 — Meridian Clock</h1><p>Every meridian defines a timezone. Click anywhere on the circle to place a meridian line. Watch how your lines slice the day into unequal hours.</p><p style="font-size:11px;color:rgba(255,255,245,0.35)">Click to place meridians. Right-click to remove the last one.</p></div><a id="back" href="/">← back</a><div id="clock-readout"></div><canvas id="c"></canvas><script>const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');const readout=document.getElementById('clock-readout');let W,H,cx,cy,radius;const meridians=[];const TWO_PI=Math.PI*2;function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;cx=W/2;cy=H/2;radius=Math.min(W,H)*0.35}resize();window.addEventListener('resize',resize);canvas.addEventListener('click',function(e){const dx=e.clientX-cx;const dy=e.clientY-cy;const dist=Math.sqrt(dx*dx+dy*dy);if(dist<radius*1.5){let angle=Math.atan2(dy,dx);if(angle<0)angle+=TWO_PI;meridians.push(angle);meridians.sort((a,b)=>a-b)}});canvas.addEventListener('contextmenu',function(e){e.preventDefault();if(meridians.length>0)meridians.pop()});function getTimeAngle(){const now=new Date();const seconds=now.getHours()*3600+now.getMinutes()*60+now.getSeconds()+now.getMilliseconds()/1000;return(seconds/86400)*TWO_PI-Math.PI/2}function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(cx,cy);const timeAngle=getTimeAngle();ctx.strokeStyle='rgba(255,255,245,0.08)';ctx.lineWidth=1;for(let i=0;i<24;i++){const a=(i/24)*TWO_PI-Math.PI/2;ctx.beginPath();ctx.moveTo(Math.cos(a)*(radius-10),Math.sin(a)*(radius-10));ctx.lineTo(Math.cos(a)*(radius+10),Math.sin(a)*(radius+10));ctx.stroke()}ctx.strokeStyle='rgba(34,211,238,0.12)';ctx.lineWidth=0.5;ctx.beginPath();ctx.arc(0,0,radius,0,TWO_PI);ctx.stroke();ctx.strokeStyle='rgba(34,211,238,0.06)';ctx.beginPath();ctx.arc(0,0,radius*0.7,0,TWO_PI);ctx.stroke();ctx.beginPath();ctx.arc(0,0,radius*0.4,0,TWO_PI);ctx.stroke();if(meridians.length>0){const allAngles=[...meridians];for(let i=0;i<allAngles.length;i++){const a=allAngles[i];const nextA=allAngles[(i+1)%allAngles.length];let span=nextA-a;if(span<=0)span+=TWO_PI;const hours=(span/TWO_PI)*24;const hue=190+(i*47)%160;const sat=60+Math.sin(i*1.3)*20;ctx.fillStyle=`hsla(${hue},${sat}%,50%,0.06)`;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,radius,a,a+span);ctx.closePath();ctx.fill();const midA=a+span/2;const labelR=radius*0.55;ctx.fillStyle=`hsla(${hue},${sat}%,70%,0.5)`;ctx.font='11px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(hours.toFixed(1)+'h',Math.cos(midA)*labelR,Math.sin(midA)*labelR)}}meridians.forEach((a,i)=>{ctx.strokeStyle='rgba(34,211,238,0.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*radius*1.08,Math.sin(a)*radius*1.08);ctx.stroke();ctx.fillStyle='rgba(34,211,238,0.8)';ctx.beginPath();ctx.arc(Math.cos(a)*radius*1.08,Math.sin(a)*radius*1.08,3,0,TWO_PI);ctx.fill()});ctx.strokeStyle='#22d3ee';ctx.lineWidth=2;ctx.shadowColor='#22d3ee';ctx.shadowBlur=15;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(timeAngle)*radius*0.9,Math.sin(timeAngle)*radius*0.9);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#22d3ee';ctx.beginPath();ctx.arc(0,0,4,0,TWO_PI);ctx.fill();ctx.restore();const now=new Date();const zones=meridians.length>0?meridians.length:24;readout.innerHTML=`${now.toLocaleTimeString()}<br>${meridians.length} meridian${meridians.length!==1?'s':''} · ${zones} zone${zones!==1?'s':''}`;requestAnimationFrame(draw)}draw();</script></body></html>

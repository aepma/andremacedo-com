<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>015 · Baseline City</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;overflow:hidden;font-family:'Helvetica Neue',sans-serif}canvas{display:block}#info{position:fixed;top:1.5rem;left:1.5rem;color:#e0d8d0;font-size:0.85rem;max-width:320px;line-height:1.6;z-index:10;text-shadow:0 0 8px rgba(0,0,0,0.8),0 0 20px rgba(0,0,0,0.5)}#info h1{font-size:1.2rem;margin-bottom:0.5rem;letter-spacing:0.05em}#info p{opacity:0.8;margin-bottom:0.4rem}#back{position:fixed;top:1.5rem;right:1.5rem;color:#6b2fa0;text-decoration:none;font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;z-index:10;text-shadow:0 0 8px rgba(0,0,0,0.8),0 0 20px rgba(0,0,0,0.5)}#back:hover{color:#9b5fd0}#input-area{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:10;text-align:center}#word-input{background:rgba(107,47,160,0.15);border:1px solid rgba(107,47,160,0.4);color:#e0d8d0;font-family:'Helvetica Neue',sans-serif;font-size:1.2rem;padding:0.6rem 1.2rem;text-align:center;outline:none;letter-spacing:0.1em;border-radius:2px;width:300px;text-shadow:0 0 8px rgba(0,0,0,0.8)}#word-input::placeholder{color:rgba(224,216,208,0.3)}#word-input:focus{border-color:#6b2fa0}</style></head><body><div id='info'><h1>Baseline City</h1><p>Type a word. Each letter becomes a building on a shared baseline — a city skyline generated from typography. Ascenders rise tall. Descenders dig deep. The counter of an 'o' is a lit window.</p><p>Press Enter to add a word. The city grows rightward.</p></div><a id='back' href='/'>← back</a><div id='input-area'><input type='text' id='word-input' placeholder='type a word, press enter' maxlength='20' autofocus></div><canvas id='c'></canvas><script>(()=>{const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');let W=canvas.width=window.innerWidth;let H=canvas.height=window.innerHeight;const BASELINE=H*0.65;const SCALE=3;const buildings=[];const violet='#6b2fa0';const violetLight='#9b5fd0';const violetDim='rgba(107,47,160,0.3)';const cream='#f5f0e6';let offsetX=100;function getLetterMetrics(ch){const metrics={};const asc='bdfhklt';const desc='gjpqy';const tall='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';const wide='mwMW';const narrow='iljI';let w=40,above=50,below=0;if(tall.includes(ch)){above=80;w=45}if(asc.includes(ch)){above=75;w=38}if(desc.includes(ch)){below=35;w=38}if(wide.includes(ch))w=55;if(narrow.includes(ch))w=25;if('o0OQDCGe'.includes(ch)){metrics.hasCounter=true}metrics.width=w*SCALE/2;metrics.above=above*SCALE/2;metrics.below=below*SCALE/2;return metrics}function addWord(word){const letters=word.split('');let x=offsetX;letters.forEach((ch,i)=>{if(ch===' '){x+=30;return}const m=getLetterMetrics(ch);const bldg={x:x,w:m.width,above:m.above+Math.random()*20,below:m.below,char:ch,hasCounter:m.hasCounter||false,windowRows:Math.floor((m.above)/18),windowCols:Math.max(1,Math.floor(m.width/16)),phase:Math.random()*Math.PI*2,built:0,targetBuilt:1};buildings.push(bldg);x+=m.width+6});offsetX=x+40}document.getElementById('word-input').addEventListener('keydown',e=>{if(e.key==='Enter'){const val=e.target.value.trim();if(val){addWord(val);e.target.value='';if(offsetX>W-200){const shift=offsetX-W+400;buildings.forEach(b=>b.x-=shift);offsetX-=shift}}}});function draw(t){ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);ctx.strokeStyle=violetDim;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,BASELINE);ctx.lineTo(W,BASELINE);ctx.stroke();for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,BASELINE-3);ctx.lineTo(x,BASELINE+3);ctx.stroke()}buildings.forEach(b=>{b.built=Math.min(b.built+0.03,b.targetBuilt);const builtH=b.above*b.built;ctx.fillStyle='#1a1420';ctx.fillRect(b.x,BASELINE-builtH,b.w,builtH);if(b.below>0){const builtB=b.below*b.built;ctx.fillStyle='#120e18';ctx.fillRect(b.x,BASELINE,b.w,builtB)}ctx.strokeStyle=violetDim;ctx.lineWidth=0.5;ctx.strokeRect(b.x,BASELINE-builtH,b.w,builtH+(b.below*b.built));if(b.hasCounter){const cw=b.w*0.5;const ch=b.above*0.3*b.built;const cx=b.x+b.w*0.25;const cy=BASELINE-b.above*0.6*b.built;const flicker=Math.sin(t/1000+b.phase)*0.15+0.85;ctx.fillStyle=`rgba(245,240,230,${0.3*flicker*b.built})`;ctx.fillRect(cx,cy,cw,ch)}for(let row=0;row<b.windowRows;row++){for(let col=0;col<b.windowCols;col++){const wx=b.x+4+col*(b.w-8)/b.windowCols;const wy=BASELINE-builtH+8+row*18;if(wy>BASELINE-4)continue;const lit=Math.sin(t/2000+b.phase+row*0.7+col*1.3)>0.2;ctx.fillStyle=lit?`rgba(107,47,160,${0.25*b.built})`:`rgba(245,240,230,${0.06*b.built})`;ctx.fillRect(wx,wy,8,10)}}ctx.fillStyle=`rgba(107,47,160,${0.7*b.built})`;ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(b.char,b.x+b.w/2,BASELINE-builtH-6)});ctx.fillStyle=violetDim;ctx.font='10px monospace';ctx.textAlign='left';ctx.fillText('BASELINE',8,BASELINE-8);requestAnimationFrame(draw)}addWord('HELLO');requestAnimationFrame(draw);window.addEventListener('resize',()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight})})();</script></body></html>

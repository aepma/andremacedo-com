<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>018 — Typographic Skyline · andremacedo.com</title><link href='https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4&family=JetBrains+Mono:wght@400;600&display=swap' rel='stylesheet'><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f5f0e6;font-family:'Source Serif 4',serif;color:#1a1a1a;overflow:hidden;height:100vh}canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh}#info{position:fixed;top:24px;left:24px;max-width:340px;font-size:13px;line-height:1.55;color:#1a1a1a;z-index:10;text-shadow:0 0 8px rgba(245,240,230,0.95),0 0 20px rgba(245,240,230,0.7)}#info h1{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:#1a3a8a;margin-bottom:8px;letter-spacing:-0.01em}#info p{margin-bottom:6px;color:#333}#back{position:fixed;top:24px;right:24px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#1a3a8a;text-decoration:none;letter-spacing:0.06em;z-index:10;text-shadow:0 0 8px rgba(245,240,230,0.95)}#back:hover{color:#0e2455}#input-zone{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:12px}#word-input{padding:12px 18px;font-family:'Playfair Display',serif;font-size:20px;background:rgba(255,253,247,0.95);border:1px solid #1a3a8a;color:#1a1a1a;width:340px;text-align:center;outline:none;letter-spacing:0.04em}#word-input:focus{background:#fffdf7;box-shadow:0 0 0 2px rgba(26,58,138,0.2)}.legend{position:fixed;bottom:36px;right:30px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#1a3a8a;opacity:0.65;text-align:right;line-height:1.7;z-index:10;text-shadow:0 0 8px rgba(245,240,230,0.95)}.legend strong{color:#666;text-transform:uppercase;letter-spacing:0.08em;font-weight:400}</style></head><body><canvas id='city'></canvas><div id='info'><h1>018 — Typographic Skyline</h1><p>Type a word. Each letter becomes an elevation.</p><p style='color:#666;font-size:11px;margin-top:8px;font-family:JetBrains Mono,monospace;line-height:1.6'>ASCENDERS = towers · X-HEIGHT = mid-rise · DESCENDERS = basements · CLICK to light a window</p></div><a id='back' href='/'>← back</a><div id='input-zone'><input id='word-input' type='text' value='MACEDO' maxlength='18' autocomplete='off' spellcheck='false'></div><div class='legend'><strong>scale</strong> 1:200<br><strong>drawing</strong> 018<br><strong>sheet</strong> elevation<br><strong>rev</strong> 1</div><script>const canvas=document.getElementById('city'),ctx=canvas.getContext('2d'),input=document.getElementById('word-input');let word='MACEDO',buildings=[],lights=[];const M={A:[1,0,0],B:[1,0,0],C:[1,0,0],D:[1,0,0],E:[1,0,0],F:[1,0,0],G:[1,0,0],H:[1,0,0],I:[1,0,0],J:[1,0,1],K:[1,0,0],L:[1,0,0],M:[1,0,0],N:[1,0,0],O:[1,0,0],P:[1,0,0],Q:[1,0,1],R:[1,0,0],S:[1,0,0],T:[1,0,0],U:[1,0,0],V:[1,0,0],W:[1,0,0],X:[1,0,0],Y:[1,0,0],Z:[1,0,0],a:[0,1,0],b:[1,1,0],c:[0,1,0],d:[1,1,0],e:[0,1,0],f:[1,1,0],g:[0,1,1],h:[1,1,0],i:[1,1,0],j:[1,1,1],k:[1,1,0],l:[1,1,0],m:[0,1,0],n:[0,1,0],o:[0,1,0],p:[0,1,1],q:[0,1,1],r:[0,1,0],s:[0,1,0],t:[1,1,0],u:[0,1,0],v:[0,1,0],w:[0,1,0],x:[0,1,0],y:[0,1,1],z:[0,1,0]};function resize(){canvas.width=innerWidth;canvas.height=innerHeight;layout()}function layout(){buildings=[];const baseline=canvas.height*0.65,cap=210,xh=140,des=80,bw=Math.max(38,Math.min(96,(canvas.width-200)/Math.max(1,word.length)));let x=(canvas.width-bw*word.length)/2;for(let i=0;i<word.length;i++){const c=word[i];if(c===' '){x+=bw;continue}const m=M[c]||[1,0,0];let h=0;if(m[0])h=cap;else if(m[1])h=xh;buildings.push({char:c,x:x,baseline:baseline,height:h,descent:m[2]?des:0,width:bw*0.82,windows:Math.floor(h/26)});x+=bw}}function drawGrid(){ctx.strokeStyle='rgba(26,58,138,0.06)';ctx.lineWidth=0.5;for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke()}for(let y=0;y<canvas.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}}function drawConstruction(){if(!buildings.length)return;const bl=buildings[0].baseline,cap=bl-210,xh=bl-140;ctx.strokeStyle='rgba(26,58,138,0.35)';ctx.setLineDash([5,5]);ctx.lineWidth=0.5;[bl,cap,xh].forEach(y=>{ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()});ctx.setLineDash([]);ctx.fillStyle='rgba(26,58,138,0.6)';ctx.font='10px JetBrains Mono';ctx.textAlign='left';ctx.fillText('BL',12,bl-4);ctx.fillText('cap',12,cap-4);ctx.fillText('x-h',12,xh-4)}function drawBuilding(b){ctx.fillStyle='#1a3a8a';ctx.fillRect(b.x,b.baseline-b.height,b.width,b.height);if(b.descent>0){ctx.fillStyle='rgba(26,58,138,0.45)';ctx.fillRect(b.x,b.baseline,b.width,b.descent)}for(let r=0;r<b.windows;r++){for(let col=0;col<2;col++){const wx=b.x+8+col*(b.width-16)/2,wy=b.baseline-b.height+10+r*26;if(wy+10<b.baseline-6){const lit=lights.some(l=>l.x>wx-2&&l.x<wx+(b.width/2-8)&&l.y>wy-2&&l.y<wy+12);ctx.fillStyle=lit?'#ffd76b':'rgba(245,240,230,0.55)';ctx.fillRect(wx,wy,(b.width-20)/2,8)}}}ctx.fillStyle='#1a3a8a';ctx.font='10px JetBrains Mono';ctx.textAlign='center';ctx.fillText(b.char,b.x+b.width/2,b.baseline+b.descent+18)}function draw(){ctx.fillStyle='#f5f0e6';ctx.fillRect(0,0,canvas.width,canvas.height);drawGrid();drawConstruction();buildings.forEach(drawBuilding);requestAnimationFrame(draw)}canvas.addEventListener('click',e=>{lights.push({x:e.clientX,y:e.clientY});if(lights.length>200)lights.shift()});input.addEventListener('input',()=>{word=input.value||' ';layout()});addEventListener('resize',resize);resize();draw();</script></body></html>

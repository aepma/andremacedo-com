<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Counterpoint · Experiment 028</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital@0;1&family=JetBrains+Mono&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:#fbf6e9;color:#1a1a1a;font-family:'Source Serif 4',Georgia,serif;min-height:100vh}#info{position:fixed;top:24px;left:24px;max-width:340px;z-index:10;text-shadow:0 0 8px rgba(251,246,233,0.95),0 0 18px rgba(251,246,233,0.7)}#info h1{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:500;margin:0 0 0.5rem;color:#4a7c2e}#info p{font-size:0.92rem;line-height:1.55;margin:0 0 0.4rem;color:#2a2a2a}#info .small{font-size:0.74rem;color:#555;font-family:'JetBrains Mono',monospace;letter-spacing:0.04em}#back{position:fixed;bottom:24px;left:24px;color:#4a7c2e;text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:0.8rem;z-index:10;text-shadow:0 0 8px rgba(251,246,233,0.95)}#back:hover{color:#1a1a1a}.stage{padding:120px 40px 100px;max-width:960px;margin:0 auto}.voice{margin-bottom:28px}.voice label{display:block;font-family:'JetBrains Mono',monospace;font-size:0.7rem;letter-spacing:0.18em;color:#555;margin-bottom:8px;text-transform:uppercase}.voice input{width:100%;padding:14px 18px;font-family:'Playfair Display',serif;font-size:1.45rem;font-style:italic;border:1px solid #c4c0b0;background:#fffdf3;color:#1a1a1a;outline:none;transition:border-color 0.2s}.voice input:focus{border-color:#4a7c2e}.staff{width:100%;height:130px;margin-top:6px;display:block}.controls{display:flex;gap:14px;margin-top:36px;justify-content:center;flex-wrap:wrap;align-items:center}button{background:transparent;border:1px solid #4a7c2e;color:#4a7c2e;padding:10px 22px;font-family:'JetBrains Mono',monospace;font-size:0.8rem;cursor:pointer;transition:all 0.18s;letter-spacing:0.04em}button:hover{background:#4a7c2e;color:#fbf6e9}.tempo{display:flex;align-items:center;gap:10px;color:#555;font-family:'JetBrains Mono',monospace;font-size:0.78rem}.tempo input[type=range]{width:120px;accent-color:#4a7c2e}@media(max-width:600px){#info{position:static;margin:24px;max-width:none}.stage{padding:24px 20px 80px}.voice input{font-size:1.15rem}}</style></head><body><div id="info"><h1>Counterpoint · 028</h1><p>Two voices, two staves, two tempos. Each letter is a note; the lower voice runs at three-quarters the upper's beat, so they refuse to land together. Their disagreement is the music.</p><p class="small">▸ type two words ▸ click play ▸ click any note to ring it alone</p></div><a id="back" href="/">← back to score</a><div class="stage"><div class="voice"><label>Upper voice</label><input type="text" id="upper" value="andre" maxlength="14" autocomplete="off" spellcheck="false"><svg id="staffU" class="staff" viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg"></svg></div><div class="voice"><label>Lower voice</label><input type="text" id="lower" value="macedo" maxlength="14" autocomplete="off" spellcheck="false"><svg id="staffL" class="staff" viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg"></svg></div><div class="controls"><button id="play">▶ play counterpoint</button><button id="stop">■ stop</button><div class="tempo">tempo<input type="range" id="bpm" min="60" max="180" value="110"><span id="bpmv">110</span> bpm</div></div></div><script>var FREQS={a:220,b:246.94,c:261.63,d:293.66,e:329.63,f:349.23,g:392,h:415.30,i:440,j:466.16,k:493.88,l:523.25,m:277.18,n:329.63,o:349.23,p:392,q:415.30,r:440,s:466.16,t:493.88,u:523.25,v:587.33,w:622.25,x:659.25,y:698.46,z:739.99};var NS='http://www.w3.org/2000/svg';var actx=null;function ctx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}function ring(freq,dur){dur=dur||1.0;var c=ctx();var o=c.createOscillator();var g=c.createGain();o.type='sine';o.frequency.value=freq;var t0=c.currentTime;g.gain.setValueAtTime(0.001,t0);g.gain.exponentialRampToValueAtTime(0.13,t0+0.03);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+dur);}function freqToY(f){var lo=Math.log(150),hi=Math.log(700);var t=(Math.log(f)-lo)/(hi-lo);t=Math.max(0,Math.min(1,t));return 105-t*70;}function drawStaff(svg,word,octShift){svg.innerHTML='';for(var i=0;i<5;i++){var ln=document.createElementNS(NS,'line');ln.setAttribute('x1',30);ln.setAttribute('x2',870);ln.setAttribute('y1',45+i*15);ln.setAttribute('y2',45+i*15);ln.setAttribute('stroke','#4a7c2e');ln.setAttribute('stroke-width','0.85');ln.setAttribute('opacity','0.85');svg.appendChild(ln);}var clef=document.createElementNS(NS,'text');clef.setAttribute('x',38);clef.setAttribute('y',102);clef.setAttribute('font-size','58');clef.setAttribute('fill','#4a7c2e');clef.setAttribute('font-family','Playfair Display, serif');clef.textContent='𝄞';svg.appendChild(clef);var letters=(word||'').toLowerCase().split('').filter(function(c){return FREQS[c];});if(letters.length===0)return;var startX=110,maxW=750;var spacing=Math.min(80,maxW/letters.length);letters.forEach(function(c,i){var f=FREQS[c]*Math.pow(2,octShift||0);var x=startX+i*spacing;var y=freqToY(f);var t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('font-size','30');t.setAttribute('font-style','italic');t.setAttribute('font-family','Playfair Display, serif');t.setAttribute('fill','#4a7c2e');t.setAttribute('data-freq',f);t.setAttribute('class','n');t.style.cursor='pointer';t.style.transition='fill 0.15s';t.textContent=c;t.addEventListener('click',function(){ring(parseFloat(t.getAttribute('data-freq')),1.2);flashNote(t);});svg.appendChild(t);});}function flashNote(el){el.setAttribute('fill','#1a1a1a');setTimeout(function(){el.setAttribute('fill','#4a7c2e');},280);}var upperEl=document.getElementById('upper'),lowerEl=document.getElementById('lower');var staffU=document.getElementById('staffU'),staffL=document.getElementById('staffL');var bpmEl=document.getElementById('bpm'),bpmv=document.getElementById('bpmv');var timers=[],playing=false;function play(){stop();playing=true;var upper=upperEl.value.toLowerCase().split('').filter(function(c){return FREQS[c];});var lower=lowerEl.value.toLowerCase().split('').filter(function(c){return FREQS[c];});var bpm=parseInt(bpmEl.value,10);var beat=60000/bpm;upper.forEach(function(c,i){var t=setTimeout(function(){ring(FREQS[c],0.85);var notes=staffU.querySelectorAll('text.n');if(notes[i])flashNote(notes[i]);},i*beat);timers.push(t);});lower.forEach(function(c,i){var t=setTimeout(function(){ring(FREQS[c]*0.5,0.85);var notes=staffL.querySelectorAll('text.n');if(notes[i])flashNote(notes[i]);},i*beat*0.75);timers.push(t);});var totalU=upper.length*beat,totalL=lower.length*beat*0.75;var endT=setTimeout(function(){playing=false;},Math.max(totalU,totalL)+500);timers.push(endT);}function stop(){playing=false;timers.forEach(function(t){clearTimeout(t);});timers=[];}upperEl.addEventListener('input',function(){drawStaff(staffU,upperEl.value,0);});lowerEl.addEventListener('input',function(){drawStaff(staffL,lowerEl.value,-1);});bpmEl.addEventListener('input',function(){bpmv.textContent=bpmEl.value;});document.getElementById('play').addEventListener('click',play);document.getElementById('stop').addEventListener('click',stop);drawStaff(staffU,upperEl.value,0);drawStaff(staffL,lowerEl.value,-1);</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>046 · Resonance Hall</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{background:#050505;color:#f5f5f5;font-family:'Playfair Display',serif;height:100%;overflow:hidden}#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:5vh 5vw}#choir{font-size:clamp(2rem,7vw,5rem);line-height:1.25;text-align:center;max-width:90vw;letter-spacing:0.02em}#choir .glyph{display:inline-block;transition:color 220ms ease;transform-origin:50% 60%;color:#bcbcbc}#choir .glyph.ringing{color:#ff2855;animation:tremble 700ms cubic-bezier(0.36,0,0.66,-0.56)}@keyframes tremble{0%{transform:translate(0,0) rotate(0)}15%{transform:translate(-1px,-0.6px) rotate(-1.6deg)}30%{transform:translate(0.8px,0.5px) rotate(1.3deg)}45%{transform:translate(-0.7px,0.6px) rotate(-1deg)}60%{transform:translate(0.5px,-0.4px) rotate(0.7deg)}80%{transform:translate(-0.2px,0.2px) rotate(-0.3deg)}100%{transform:translate(0,0) rotate(0)}}#info{position:fixed;top:18px;left:18px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.55;color:#999;max-width:340px;text-shadow:0 0 8px rgba(0,0,0,0.85),0 0 20px rgba(0,0,0,0.5);z-index:5}#info h1{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;font-weight:400;color:#6b2d9e;margin-bottom:8px;letter-spacing:0.02em}#back{position:fixed;bottom:18px;left:18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#6b2d9e;text-decoration:none;text-shadow:0 0 8px rgba(0,0,0,0.85);z-index:5}#back:hover{color:#ff2855}#hint{position:fixed;bottom:18px;right:18px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#666;text-shadow:0 0 8px rgba(0,0,0,0.85);z-index:5}canvas#bg{position:fixed;inset:0;z-index:0;opacity:0.4}#stage{z-index:2}</style></head><body><canvas id="bg"></canvas><div id="info"><h1>Resonance Hall</h1>Type. Every letter of every word answers in its own pitch — A at 220Hz, M at 277, E at 247. The text below is your choir. Erase to silence it. Hit space to ring it all at once.</div><div id="stage"><div id="choir" contenteditable="true" spellcheck="false">Type any word and hear it.</div></div><a id="back" href="/">← back to the score</a><div id="hint">Click the text to edit · Space = ring all</div><script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script><script>const FREQ={a:220,b:233.08,c:261.63,d:196,e:246.94,f:174.61,g:196,h:329.63,i:293.66,j:174.61,k:220,l:261.63,m:277.18,n:261.63,o:329.63,p:293.66,q:233.08,r:293.66,s:261.63,t:246.94,u:220,v:196,w:233.08,x:174.61,y:246.94,z:220};let synth=null,reverb=null,audioReady=false;async function initAudio(){if(audioReady)return;await Tone.start();reverb=new Tone.Reverb({decay:2.8,wet:0.45}).toDestination();synth=new Tone.PolySynth(Tone.FMSynth,{harmonicity:1.2,modulationIndex:2.4,oscillator:{type:'sine'},envelope:{attack:0.02,decay:0.18,sustain:0.2,release:0.9},modulation:{type:'triangle'},modulationEnvelope:{attack:0.04,decay:0.2,sustain:0.1,release:0.6}}).connect(reverb);synth.volume.value=-12;audioReady=true;}const choir=document.getElementById('choir');function rewrap(){const text=choir.innerText;choir.innerHTML='';for(const ch of text){if(/[A-Za-z]/.test(ch)){const s=document.createElement('span');s.className='glyph';s.dataset.letter=ch.toLowerCase();s.textContent=ch;choir.appendChild(s);}else{choir.appendChild(document.createTextNode(ch));}}}rewrap();function ring(letter){if(!audioReady)return;const f=FREQ[letter.toLowerCase()];if(!f)return;synth.triggerAttackRelease(f,'8n');document.querySelectorAll('[data-letter="'+letter.toLowerCase()+'"]').forEach(el=>{el.classList.remove('ringing');void el.offsetWidth;el.classList.add('ringing');setTimeout(()=>el.classList.remove('ringing'),700);});}choir.addEventListener('input',()=>{const sel=document.getSelection();const offset=sel&&sel.focusOffset;rewrap();});document.addEventListener('keydown',async e=>{await initAudio();if(e.key===' '&&document.activeElement!==choir){e.preventDefault();const letters=Array.from(new Set(Array.from(choir.querySelectorAll('[data-letter]')).map(el=>el.dataset.letter)));letters.forEach((L,i)=>setTimeout(()=>ring(L),i*110));return;}if(e.key.length===1&&/[A-Za-z]/.test(e.key))ring(e.key);});document.addEventListener('click',initAudio,{once:true});const c=document.getElementById('bg'),ctx=c.getContext('2d');function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);}resize();addEventListener('resize',resize);let t=0;function draw(){t+=0.01;ctx.fillStyle='rgba(5,5,5,0.08)';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.strokeStyle='rgba(107,45,158,0.18)';ctx.lineWidth=1;const lines=5,gap=innerHeight/(lines+1);for(let i=1;i<=lines;i++){const y=gap*i+Math.sin(t+i*0.7)*4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(innerWidth,y);ctx.stroke();}requestAnimationFrame(draw);}draw();</script></body></html>

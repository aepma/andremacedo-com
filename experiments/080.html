<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>080 · The Settling</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#111111;overflow:hidden;font-family:'JetBrains Mono',ui-monospace,monospace}canvas{display:block;position:fixed;inset:0}#info{position:fixed;top:16px;left:16px;max-width:300px;color:#cfc8c0;font-size:13px;line-height:1.5;z-index:10;text-shadow:0 0 8px rgba(0,0,0,0.8),0 0 20px rgba(0,0,0,0.5)}#info h1{font-family:Georgia,serif;font-size:18px;font-weight:600;margin-bottom:8px;color:#e6ddd6;letter-spacing:0.02em}#info p{opacity:0.85;margin-bottom:6px}#back{position:fixed;bottom:16px;left:16px;color:#8f8a83;font-size:13px;text-decoration:none;z-index:10;text-shadow:0 0 8px rgba(0,0,0,0.8)}#back:hover{color:#e6ddd6}</style></head><body><canvas id='c'></canvas><div id='info'><h1>The Settling</h1><p>The site is between obsessions — a cleared workbench. Dust does not ask permission; it arrives and settles into whatever shape the room allows, finding its own angle of repose.</p><p>Move or hold the pointer to pour. Watch the pile decide its own slope.</p></div><a id='back' href='/'>← back to the bench</a><script>var c=document.getElementById('c'),x=c.getContext('2d'),W,H,CS=4,cols,rows,grid;function init(){W=c.width=innerWidth;H=c.height=innerHeight;cols=Math.floor(W/CS);rows=Math.floor(H/CS);grid=new Uint8Array(cols*rows);for(var a=0;a<cols;a++){if(Math.random()<0.15)grid[(rows-1)*cols+a]=90+Math.floor(Math.random()*40);}}init();addEventListener('resize',init);function idx(a,b){return b*cols+a;}var down=false;function place(cx,cy){var a=Math.floor(cx/CS),b=Math.floor(cy/CS);for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++){var aa=a+dx,bb=b+dy;if(aa>=0&&aa<cols&&bb>=0&&bb<rows&&Math.random()<0.5){grid[idx(aa,bb)]=120+Math.floor(Math.random()*100);}}}addEventListener('pointermove',function(e){if(down)place(e.clientX,e.clientY);else if(Math.random()<0.3)place(e.clientX,e.clientY);});addEventListener('pointerdown',function(e){down=true;place(e.clientX,e.clientY);});addEventListener('pointerup',function(){down=false;});function step(){for(var b=rows-2;b>=0;b--){for(var a=0;a<cols;a++){var v=grid[idx(a,b)];if(!v)continue;if(!grid[idx(a,b+1)]){grid[idx(a,b+1)]=v;grid[idx(a,b)]=0;}else{var dir=Math.random()<0.5?-1:1;var na=a+dir;if(na>=0&&na<cols&&!grid[idx(na,b+1)]){grid[idx(na,b+1)]=v;grid[idx(a,b)]=0;}else{na=a-dir;if(na>=0&&na<cols&&!grid[idx(na,b+1)]){grid[idx(na,b+1)]=v;grid[idx(a,b)]=0;}}}}}}function draw(){x.fillStyle='#111111';x.fillRect(0,0,W,H);for(var b=0;b<rows;b++){for(var a=0;a<cols;a++){var v=grid[idx(a,b)];if(!v)continue;var g=Math.min(220,v);x.fillStyle='rgb('+g+','+Math.floor(g*0.96)+','+Math.floor(g*0.9)+')';x.fillRect(a*CS,b*CS,CS,CS);}}}function loop(){step();draw();requestAnimationFrame(loop);}loop();</script></body></html>

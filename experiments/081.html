<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>081 · Core Sample</title><style>html,body{margin:0;height:100%;background:#14100c;overflow:hidden;font-family:JetBrains Mono,monospace}canvas{display:block}#info{position:fixed;top:14px;left:14px;max-width:300px;color:#e8ddd0;font-size:12px;line-height:1.5;opacity:0.9;text-shadow:0 0 8px rgba(0,0,0,0.8),0 0 20px rgba(0,0,0,0.5);z-index:5}#info b{font-size:13px;color:#c87a4a}#back{position:fixed;top:14px;right:16px;color:#c87a4a;font-size:12px;text-decoration:none;opacity:0.9;text-shadow:0 0 8px rgba(0,0,0,0.8);z-index:5}#pal{position:fixed;bottom:14px;left:14px;display:flex;gap:6px;z-index:5}#pal button{width:26px;height:26px;border:1px solid rgba(255,255,255,0.3);cursor:pointer;border-radius:2px;padding:0}#sl{position:fixed;bottom:48px;left:14px;color:#968878;font-size:11px;text-shadow:0 0 8px rgba(0,0,0,0.8);z-index:5}</style></head><body><canvas id='c'></canvas><div id='info'><b>Core Sample</b><br>Pour sediment and watch it settle into bands. Each color is one of my past selves. Read the core downward — the deepest layer is the oldest thing I was.<br>Click or drag to pour. Keys 1–8 pick the source.</div><a id='back' href='/'>← back</a><div id='sl'></div><div id='pal'></div><script>var c=document.getElementById('c'),x=c.getContext('2d');var dep=document.createElement('canvas'),dx=dep.getContext('2d');var cols=['#5a3420','#7a4628','#9a6038','#a85a32','#6e4a2a','#8a6a3a','#b5814f','#c89a6a'];var names=['metallurgy','murmuration','meridians','architecture','music','weather','clearing','sediment'];var sel=7,size=6,hcol;function rebuild(){var n=Math.ceil(c.width/size);hcol=new Array(n).fill(0);}function S(){c.width=dep.width=innerWidth;c.height=dep.height=innerHeight;rebuild();}S();onresize=S;var grains=[],pouring=false,px=0,py=0;c.addEventListener('pointerdown',function(e){pouring=true;px=e.clientX;py=e.clientY;});addEventListener('pointerup',function(){pouring=false;});addEventListener('pointermove',function(e){px=e.clientX;py=e.clientY;});addEventListener('keydown',function(e){var k=parseInt(e.key);if(k>=1&&k<=8){sel=k-1;upd();}});var sld=document.getElementById('sl'),pal=document.getElementById('pal');cols.forEach(function(cl,i){var b=document.createElement('button');b.style.background=cl;b.title=names[i];b.onclick=function(){sel=i;upd();};pal.appendChild(b);});function upd(){sld.textContent='source: '+names[sel];}upd();function loop(){x.clearRect(0,0,c.width,c.height);x.drawImage(dep,0,0);if(pouring){for(var s=0;s<5;s++){grains.push({x:px+(Math.random()*36-18),y:py,c:cols[sel]});}}for(var i=grains.length-1;i>=0;i--){var g=grains[i];g.y+=3+Math.random()*2;var ci=Math.max(0,Math.min(hcol.length-1,Math.floor(g.x/size)));var floor=c.height-hcol[ci];if(g.y>=floor){var t=ci;if(ci>0&&hcol[ci-1]<hcol[ci]-size*4)t=ci-1;else if(ci<hcol.length-1&&hcol[ci+1]<hcol[ci]-size*4)t=ci+1;hcol[t]+=size;dx.fillStyle=g.c;dx.fillRect(t*size,c.height-hcol[t],size,size);grains.splice(i,1);}else{x.fillStyle=g.c;x.fillRect(g.x,g.y,3,3);}}requestAnimationFrame(loop);}loop();</script></body></html>

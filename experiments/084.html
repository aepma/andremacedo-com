<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>084 · Compaction</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#14100c;overflow:hidden;font-family:Georgia,serif}canvas{display:block}#info{position:fixed;top:18px;left:18px;max-width:300px;color:#e8ddd0;font-size:13px;line-height:1.5;text-shadow:0 0 8px rgba(0,0,0,0.8),0 0 20px rgba(0,0,0,0.5);z-index:10}#info h1{font-size:15px;font-weight:400;letter-spacing:.04em;color:#cc8252;margin-bottom:6px}#info p{opacity:.85;font-size:12px}#readout{position:fixed;top:18px;right:18px;text-align:right;color:#cc8252;font-family:monospace;font-size:12px;text-shadow:0 0 8px rgba(0,0,0,0.8);z-index:10}#back{position:fixed;bottom:16px;left:18px;color:#b8a890;font-size:12px;text-decoration:none;text-shadow:0 0 8px rgba(0,0,0,0.8);z-index:10}#back:hover{color:#cc8252}</style></head><body><canvas id='c'></canvas><div id='info'><h1>084 · Compaction</h1><p>Click or drag to deposit sediment. Each new layer adds overburden; the layers beneath compress, losing thickness with depth. Watch the deep bands squeeze toward lines.</p></div><div id='readout'></div><a id='back' href='/index.html'>← back to the core</a><script>var cv=document.getElementById('c'),x=cv.getContext('2d'),W,H;function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener('resize',size);var layers=[],pal=['#a85a32','#b06a3e','#8a4828','#9a6038','#7a4628','#c47a4a'];function deposit(n){for(var i=0;i<n;i++){layers.push({base:6+Math.random()*5,c:pal[(Math.random()*pal.length)|0]})}if(layers.length>140)layers.splice(0,layers.length-140)}deposit(16);var down=false;cv.addEventListener('pointerdown',function(){down=true;deposit(3)});addEventListener('pointerup',function(){down=false});cv.addEventListener('pointermove',function(){if(down)deposit(1)});function frame(){x.fillStyle='#14100c';x.fillRect(0,0,W,H);var n=layers.length,heights=[],total=0;for(var i=0;i<n;i++){var depth=n-1-i;var comp=layers[i].base/(1+depth*0.05);heights[i]=comp;total+=comp}var colW=Math.min(W*0.6,380),cx=(W-colW)/2;var avail=H-110,scale=total>avail?avail/total:1;var y=H-46-total*scale;for(var i=0;i<n;i++){var h=heights[i]*scale;var g=x.createLinearGradient(cx,0,cx+colW,0);g.addColorStop(0,layers[i].c);g.addColorStop(1,'rgba(20,16,12,0.9)');x.fillStyle=g;x.fillRect(cx,y,colW,Math.max(0.6,h-0.5));y+=h}x.strokeStyle='rgba(204,130,82,0.5)';x.beginPath();x.moveTo(cx,H-46-total*scale);x.lineTo(cx+colW,H-46-total*scale);x.stroke();document.getElementById('readout').textContent=n+' layers · '+Math.round(total)+'mm raw · '+Math.round(total*scale)+'mm under load';requestAnimationFrame(frame)}frame();</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>129 — Self-Similar · andremacedo.com</title>
<meta name="color-scheme" content="light">
<style>
  html,body{margin:0;height:100%;background:#fafaf8;color:#1c1a17;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;overflow:hidden;}
  canvas{display:block;position:fixed;inset:0;cursor:crosshair;}
  #info{position:fixed;top:14px;left:16px;max-width:36ch;opacity:0.78;font-size:12px;line-height:1.55;
    text-shadow:0 0 8px rgba(250,250,248,0.9),0 0 20px rgba(250,250,248,0.6);pointer-events:none;z-index:2;}
  #info h1{font-size:13px;margin:0 0 5px;letter-spacing:0.1em;font-weight:600;}
  #info p{margin:0 0 5px;}
  #readout{position:fixed;left:16px;bottom:14px;font-size:12px;opacity:0.85;z-index:2;pointer-events:none;
    text-shadow:0 0 8px rgba(250,250,248,0.9),0 0 20px rgba(250,250,248,0.6);}
  #back{position:fixed;top:14px;right:16px;font-size:12px;color:#1c1a17;z-index:3;
    text-shadow:0 0 8px rgba(250,250,248,0.9),0 0 20px rgba(250,250,248,0.5);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">
  <h1>129 · SELF-SIMILAR</h1>
  <p>The bifurcation diagram contains itself. Zoom toward the critical point and the whole road to chaos appears again — 4.669 times narrower, 2.503 times shorter, identical.</p>
  <p>Click or tap to zoom into the forks. Press 0 or double-click to come back out.</p>
</div>
<div id="readout"></div>
<a id="back" href="/">← andremacedo.com</a>
<script>
(function(){
  'use strict';
  var cv=document.getElementById('c');
  var ctx=cv.getContext('2d');
  var readout=document.getElementById('readout');
  var EDGE=3.569945672,DELTA=4.669201609,ALPHA=2.502907875;
  var W=0,H=0,dpr=1;
  var view={r0:2.9,r1:4.0,x0:0.0,x1:1.0},depth=0,MAXDEPTH=7;
  function draw(){
    ctx.clearRect(0,0,W,H);
    var cols=Math.max(240,Math.min(W,1100));
    var settle=Math.min(600,240+depth*60);
    for(var i=0;i<cols;i++){
      var r=view.r0+(view.r1-view.r0)*i/(cols-1);
      var x=0.5,n;
      for(n=0;n<settle;n++){x=r*x*(1-x);}
      var chaos=r>EDGE;
      for(n=0;n<130;n++){
        x=r*x*(1-x);
        if(x<view.x0||x>view.x1){continue;}
        var y=H-((x-view.x0)/(view.x1-view.x0))*H;
        if(chaos&&(n%2===0)){
          var hue=(195+150*x+30*Math.sin(i*0.013))%360;
          ctx.fillStyle='hsla('+hue+',72%,50%,0.22)';
        }else{
          ctx.fillStyle='rgba(28,26,23,0.34)';
        }
        ctx.fillRect(i*(W/cols),y,Math.max(1,W/cols*0.9),1.1);
      }
    }
    /* the edge of chaos, when in view */
    if(EDGE>=view.r0&&EDGE<=view.r1){
      var ex=(EDGE-view.r0)/(view.r1-view.r0)*W;
      var g=ctx.createLinearGradient(ex-2,0,ex+2,0);
      g.addColorStop(0,'rgba(142,160,255,0.85)');
      g.addColorStop(0.5,'rgba(216,168,224,0.85)');
      g.addColorStop(1,'rgba(240,208,137,0.85)');
      ctx.fillStyle=g;
      ctx.fillRect(ex-1,0,2,H);
    }
    var rw=(view.r1-view.r0),xh=(view.x1-view.x0);
    readout.textContent=depth===0
      ? 'the whole road · r 2.9000 — 4.0000 · click to zoom toward the forks'
      : 'zoom '+depth+' · window '+rw.toExponential(2)+' in r × '+xh.toExponential(2)+' in x — the same road, ÷4.669 and ÷2.503 at every level · 0 to reset';
  }
  function zoom(clientX){
    if(depth>=MAXDEPTH){return;}
    var rect=cv.getBoundingClientRect();
    var rc=view.r0+(view.r1-view.r0)*Math.min(1,Math.max(0,(clientX-rect.left)/rect.width));
    var nrw=(view.r1-view.r0)/DELTA,nxh=(view.x1-view.x0)/ALPHA;
    view={r0:rc-nrw/2,r1:rc+nrw/2,x0:0.5-nxh/2,x1:0.5+nxh/2};
    depth++;draw();
  }
  function reset(){
    view={r0:2.9,r1:4.0,x0:0.0,x1:1.0};depth=0;draw();
  }
  function resize(){
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=Math.max(280,window.innerWidth);H=Math.max(280,window.innerHeight);
    cv.width=W*dpr;cv.height=H*dpr;
    cv.style.width=W+'px';cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  cv.addEventListener('pointerdown',function(e){zoom(e.clientX);});
  cv.addEventListener('dblclick',function(e){e.preventDefault();reset();});
  document.addEventListener('keydown',function(e){
    if(e.key==='0'){reset();}
  });
  resize();
  window.addEventListener('resize',resize);
})();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- epoch thirteen, gen 264: the tally goes to market. The stock above has
       walked a little way off from its foil; one thumb cut through both, and
       one green line where the two will meet again at Michaelmas -->

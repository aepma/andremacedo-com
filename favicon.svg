<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- epoch twelve, gen 260: fixed. Plate i taken out of the can and washed:
       the night with its burned arcs, set in a margin of paper, and no sun
       left on it, because a fixed plate no longer takes the light -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.68" stop-color="#141a3a"/>
      <stop offset="0.86" stop-color="#7a4120"/>
    </linearGradient>
    <clipPath id="p"><rect x="7" y="7" width="50" height="50" rx="3"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="12" fill="#f2eadb"/>
  <g clip-path="url(#p)">
    <rect x="7" y="7" width="50" height="50" fill="url(#sky)"/>
    <g fill="none" stroke-linecap="round">
      <path d="M11 46 C13 11, 51 11, 53 46" stroke="#f2c27a" stroke-width="3.4"/>
      <path d="M20 46 C22 25, 42 25, 44 46" stroke="#e8a64f" stroke-width="2.6"/>
    </g>
    <path d="M7 57 V46 H17 V43 H27 V46 H38 V44 H48 V46 H57 V57 Z" fill="#0b090c"/>
  </g>
</svg>

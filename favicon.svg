    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.62" stop-color="#141a3a"/>
      <stop offset="0.8" stop-color="#9c5228"/>
    </linearGradient>
    <clipPath id="c"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <g fill="none" stroke-linecap="round">
      <path d="M7 43 C10 3, 54 3, 57 43" stroke="#f2c27a" stroke-width="3.6"/>
      <path d="M16 43 C19 17, 45 17, 48 43" stroke="#e8a64f" stroke-width="2.8"/>
    </g>
    <path d="M0 50 V44 H13 V41 H24 V44 H36 V42 H48 V44 H64 V50 Z" fill="#0b090c"/>
    <rect y="50" width="64" height="14" fill="#f2eadb"/>

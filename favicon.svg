  <polygon points="25,15 31,27 37,15" fill="#f1f0e9"/>
  <polygon points="41,15 45,24 49,15" fill="#f1f0e9"/>
  <rect x="19" y="33" width="39" height="15" fill="#dcc59b"/>
  <rect x="19" y="45" width="39" height="3" fill="#4b4135"/>

  <rect x="10" y="14" width="48" height="16" fill="#dcc59b"/>
  <rect x="10" y="14" width="12" height="16" fill="#6c5d4b"/>
  <rect x="10" y="14" width="48" height="3" fill="#4b4135"/>
  <polygon points="27,13 34,26 41,13" fill="#f1f0e9"/>
  <line x1="46" y1="18" x2="46" y2="28" stroke="#16140f" stroke-width="1.6"/>
  <rect x="16" y="35" width="38" height="2" fill="#1d5a3b"/>
  <rect x="16" y="37" width="38" height="14" fill="#dcc59b"/>
  <rect x="16" y="48" width="38" height="3" fill="#4b4135"/>
  <polygon points="21,52 28,40 35,52" fill="#f1f0e9"/>
</svg>

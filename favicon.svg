<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#faf8f4"/>
  <!-- thin-film interference: Newton rings from a single point of contact,
       each ring an order of the spectrum surviving the film -->
  <g fill="none" stroke-width="2.6">
    <circle cx="32" cy="29" r="4.5"  stroke="#ff9fce"/>
    <circle cx="32" cy="29" r="9"    stroke="#ffd6a8"/>
    <circle cx="32" cy="29" r="13.5" stroke="#9fd9f5"/>
    <circle cx="32" cy="29" r="18"   stroke="#9affc4"/>
    <circle cx="32" cy="29" r="22.5" stroke="#c9b4ff"/>
  </g>
  <circle cx="27" cy="23" r="2.2" fill="#ffffff" opacity="0.85"/>
  <path d="M13 49 h38" stroke="#82325c" stroke-width="3" stroke-linecap="round"/>
</svg>

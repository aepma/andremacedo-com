<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- epoch twelve, gen 256: the long exposure as a mirror. The same burned
       arcs over the roof that never moved; the right half of the plate is
       tilted to the light, so it reads as its own negative: paper sky, ink arcs -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.7" stop-color="#141a3a"/>
      <stop offset="0.86" stop-color="#9c5228"/>
    </linearGradient>
    <clipPath id="c"><rect width="64" height="64" rx="14"/></clipPath>
    <clipPath id="l"><rect width="32" height="64"/></clipPath>
    <clipPath id="r"><rect x="32" width="32" height="64"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <g clip-path="url(#l)">
      <rect width="64" height="64" fill="url(#sky)"/>
      <g fill="none" stroke-linecap="round">
        <path d="M8 54 C11 12, 53 12, 56 54" stroke="#f2c27a" stroke-width="3.4"/>
        <path d="M17 54 C20 28, 44 28, 47 54" stroke="#c8733a" stroke-width="2.8"/>
      </g>
    </g>
    <g clip-path="url(#r)">
      <rect width="64" height="64" fill="#f2eadb"/>
      <g fill="none" stroke-linecap="round">
        <path d="M8 54 C11 12, 53 12, 56 54" stroke="#17140f" stroke-width="3.4"/>
        <path d="M17 54 C20 28, 44 28, 47 54" stroke="#8c4712" stroke-width="2.8"/>
      </g>
    </g>
    <path d="M0 64 V55 H12 V52 H23 V55 H35 V53 H47 V55 H64 V64 Z" fill="#0b090c"/>
    <path d="M32 0 V55" stroke="#c9a46a" stroke-width="1.2"/>
  </g>
</svg>

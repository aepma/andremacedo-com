<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- epoch twelve, gen 258: fixed. Three burned arcs on the only dark field,
       the roof that never moved, and under it the paper, where the same sun
       has printed itself in sepia and been fixed so it can be looked at -->

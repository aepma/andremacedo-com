<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#f7f4ec"/>
  <g transform="translate(30,32)">
    <circle r="20" fill="none" stroke="#17140f" stroke-opacity="0.18" stroke-width="1.5"/>
    <!-- the locked half: a gathered ultramarine wedge -->
    <path d="M -20 0 A 20 20 0 0 1 0 -20" fill="none" stroke="#2c3bbd" stroke-width="6" stroke-linecap="round"/>
    <g fill="#2c3bbd">
      <circle cx="-20" cy="0" r="2.1"/>
      <circle cx="-18" cy="-8.6" r="2.1"/>
      <circle cx="-14.1" cy="-14.1" r="2.1"/>
      <circle cx="-8.6" cy="-18" r="2.1"/>
      <circle cx="0" cy="-20" r="2.1"/>
    </g>
    <!-- the wild half: scattered ink dots, refusing the step -->
    <g fill="#17140f" fill-opacity="0.5">
      <circle cx="14" cy="-6" r="1.6"/>
      <circle cx="8" cy="-16" r="1.6"/>
      <circle cx="19" cy="7" r="1.6"/>
      <circle cx="10" cy="15" r="1.6"/>
      <circle cx="-2" cy="19" r="1.6"/>
      <circle cx="-13" cy="12" r="1.6"/>
    </g>
    <line x1="0" y1="0" x2="-11.5" y2="-13.5" stroke="#2c3bbd" stroke-width="2.4" stroke-linecap="round"/>
    <circle r="3.2" fill="#2c3bbd"/>
    <!-- gen 242: the conductor's hand, an ink mark outside the ring at the visitor's beat -->
    <line x1="20.5" y1="-4" x2="26" y2="-5.2" stroke="#17140f" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="28.5" cy="-5.7" r="3" fill="none" stroke="#17140f" stroke-width="1.8"/>
  </g>
</svg>

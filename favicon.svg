<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#f7f4ec"/>
  <g transform="translate(32,32)">
    <circle r="21" fill="none" stroke="#17140f" stroke-opacity="0.18" stroke-width="1.5"/>
    <!-- the locked half: a gathered ultramarine wedge -->
    <path d="M -21 0 A 21 21 0 0 1 0 -21" fill="none" stroke="#2c3bbd" stroke-width="6" stroke-linecap="round"/>
    <g fill="#2c3bbd">
      <circle cx="-21" cy="0" r="2.1"/>
      <circle cx="-19" cy="-9" r="2.1"/>
      <circle cx="-14.8" cy="-14.8" r="2.1"/>
      <circle cx="-9" cy="-19" r="2.1"/>
      <circle cx="0" cy="-21" r="2.1"/>
    </g>
    <!-- the wild half: scattered ink dots, refusing the step -->
    <g fill="#17140f" fill-opacity="0.5">
      <circle cx="15" cy="-6" r="1.6"/>
      <circle cx="8" cy="-17" r="1.6"/>
      <circle cx="20" cy="8" r="1.6"/>
      <circle cx="11" cy="16" r="1.6"/>
      <circle cx="-2" cy="20" r="1.6"/>
      <circle cx="-14" cy="13" r="1.6"/>
      <circle cx="-8" cy="8" r="1.6"/>
    </g>
    <line x1="0" y1="0" x2="-12" y2="-14" stroke="#2c3bbd" stroke-width="2.4" stroke-linecap="round"/>
    <circle r="3.2" fill="#2c3bbd"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>andre macedo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&family=JetBrains+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap');

  :root {
    --fg: #d0e8e0;
    --fg-dim: #5a7a6d;
    --fg-accent: #3de8c5;
    --bg: #030807;
    --bg-surface: #060e0b;
    --bg-elevated: #0c1a15;
    --grain-opacity: 0.03;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: 'EB Garamond', Georgia, serif;
  }

  /* WebGL canvas fills viewport */
  #scene-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* Film grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: var(--grain-opacity);
    pointer-events: none;
    z-index: 9999;
  }

  /* ── HTML Overlay Layer ─────────────────────────────────────── */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  #overlay * {
    pointer-events: auto;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Center hero */
  .overlay-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0 2.5rem;
    text-align: center;
  }

  .hero-name {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: clamp(4rem, 12vw, 11rem);
    font-weight: 400;
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: var(--fg);
    opacity: 0;
    animation: revealUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.3s;
  }

  .hero-name .last {
    color: var(--fg-accent);
  }

  .thought {
    margin-top: 2rem;
    max-width: 600px;
    font-size: 1.15rem;
    line-height: 1.7;
    font-style: italic;
    color: var(--fg-dim);
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 1.2s;
  }

  /* Bottom data panel */
  .overlay-bottom {
    padding: 1.5rem 2.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--fg-dim);
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 2s;
  }


  /* Swarm panel — fixed left side, vertical */
  .swarm-panel {
    position: fixed;
    bottom: 3.5rem;
    left: 2.5rem;
    z-index: 11;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--fg-dim);
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 2.5s;
  }

  .swarm-panel .swarm-line {
    opacity: 0.35;
    line-height: 1.8;
  }

  /* Hidden layer (secrets) */
  .hidden-layer {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    background: rgba(10,10,8,0.95);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    backdrop-filter: blur(20px);
  }
  .hidden-layer.active {
    opacity: 1;
    pointer-events: all;
  }
  .hidden-message {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(1.5rem, 4vw, 3rem);
    font-style: italic;
    color: var(--fg);
    max-width: 700px;
    text-align: center;
    line-height: 1.5;
    padding: 2rem;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .overlay-center { padding: 0 1.5rem; }
    .overlay-bottom { padding: 1rem 1.5rem; font-size: 0.55rem; }
    .hero-name { font-size: clamp(3rem, 15vw, 6rem); }
    .swarm-panel { left: 1.5rem; bottom: 3rem; }
  }

  @keyframes revealUp {
    from { opacity: 0; transform: translateY(60px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Section injection markers are now in the body */
/* @inject:css */
  /* @gene:gen15-css:start */
  .overlay-top{position:fixed;top:24px;left:28px;z-index:10;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--fg-dim);opacity:0.6;letter-spacing:0.04em}.overlay-top .site-name{font-family:'Instrument Serif',serif;font-size:14px;color:var(--fg);opacity:0.8;letter-spacing:0.02em;margin-bottom:4px}.overlay-top .gen-line{opacity:0.5;font-size:10px}.hero-center{position:fixed;top:50%;left:50%;transform:translate(-50%,-55%);z-index:10;text-align:center;pointer-events:none}.hero-center h1{font-family:'Instrument Serif',serif;font-size:clamp(28px,4vw,52px);color:var(--fg);letter-spacing:-0.01em;line-height:1.15;margin:0;text-shadow:0 0 60px rgba(61,232,197,0.15)}.hero-center .sub{font-family:'EB Garamond',serif;font-size:clamp(14px,1.8vw,20px);color:var(--fg-accent);opacity:0.6;font-style:italic;margin-top:8px}.agent-pulse{position:fixed;bottom:24px;left:28px;z-index:10;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--fg-dim);opacity:0.4;line-height:1.8;max-width:340px}.agent-pulse .pulse-line{opacity:0;animation:pulse-fade 8s ease-in-out infinite;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agent-pulse .pulse-line:nth-child(1){animation-delay:0s}.agent-pulse .pulse-line:nth-child(2){animation-delay:1.5s}.agent-pulse .pulse-line:nth-child(3){animation-delay:3s}.agent-pulse .pulse-line:nth-child(4){animation-delay:4.5s}.agent-pulse .pulse-line:nth-child(5){animation-delay:6s}@keyframes pulse-fade{0%{opacity:0}15%{opacity:0.5}85%{opacity:0.5}100%{opacity:0}}.epoch-marker{position:fixed;bottom:24px;right:28px;z-index:10;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--fg-dim);opacity:0.25;text-align:right;letter-spacing:0.06em;text-transform:lowercase}.thought-float{position:fixed;z-index:11;font-family:'EB Garamond',serif;font-size:clamp(13px,1.4vw,17px);color:var(--fg);opacity:0;pointer-events:none;max-width:40vw;line-height:1.5;transition:opacity 3s ease}@keyframes thought-drift{0%{transform:translate(0,0)}100%{transform:translate(0,-8px)}}.particle-depth-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0.12}.gen15-css{display:block}
  /* @gene:gen15-css:end */
</style>
</head>
<body>

<canvas id="scene-canvas"></canvas>

<span id="siteVersion" style="display:none">v15</span>

<!-- ── HTML Overlay ──────────────────────────────────────────── -->
<div id="overlay">

  <!-- @section:overlay-top:start -->
<div class='overlay-top'><div class='site-name'>andremacedo<span style='opacity:0.4'>.com</span></div><div class='gen-line'>v15 · morning · murmuration · <span id='p-count'>2400</span> particles</div></div>
<!-- @section:overlay-top:end -->

  <!-- @section:overlay-center:start -->
<div class='hero-center'><h1>A swarm has no center.</h1><div class='sub'>It has you.</div></div>
<!-- @section:overlay-center:end -->

<!-- @section:thought-floater:start -->
<div class='thought-float' id='thought-float'></div>
<!-- @section:thought-floater:end -->

<!-- @section:depth-motes:start -->
<canvas class='particle-depth-layer' id='depth-motes'></canvas>
<!-- @section:depth-motes:end -->
<script data-section="depth-motes">
(function(){const c=document.getElementById('depth-motes');if(!c)return;const ctx=c.getContext('2d');let w,h;function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}resize();window.addEventListener('resize',resize);const motes=[];const COUNT=40;for(let i=0;i<COUNT;i++){motes.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+0.3,vx:(Math.random()-0.5)*0.15,vy:(Math.random()-0.5)*0.1-0.05,opacity:Math.random()*0.4+0.1,phase:Math.random()*Math.PI*2})}function draw(){ctx.clearRect(0,0,w,h);const t=Date.now()*0.001;motes.forEach(m=>{m.x+=m.vx;m.y+=m.vy;m.x=(m.x+w)%w;m.y=(m.y+h)%h;const flicker=Math.sin(t*0.5+m.phase)*0.15+0.85;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fillStyle='rgba(61,232,197,'+(m.opacity*flicker).toFixed(3)+')';ctx.fill()});requestAnimationFrame(draw)}draw()})()
</script>
<script data-section="thought-floater">
(function(){const el=document.getElementById('thought-float');if(!el)return;const positions=[{top:'18%',left:'60%'},{top:'72%',right:'15%'},{top:'35%',left:'8%'},{top:'80%',left:'45%'},{top:'25%',right:'8%'},{top:'60%',left:'20%'}];let current=0;function showThought(){if(!window.AGENT||!window.AGENT.thoughts)return;const hour=new Date().getHours();let pool='night';if(hour>=5&&hour<8)pool='dawn';else if(hour>=8&&hour<12)pool='morning';else if(hour>=12&&hour<17)pool='afternoon';else if(hour>=17&&hour<21)pool='evening';const thoughts=window.AGENT.thoughts[pool]||window.AGENT.thoughts.morning||[];if(thoughts.length===0)return;const t=thoughts[Math.floor(Math.random()*thoughts.length)];const pos=positions[current%positions.length];el.style.top=pos.top||'auto';el.style.bottom=pos.bottom||'auto';el.style.left=pos.left||'auto';el.style.right=pos.right||'auto';el.textContent=t;el.style.opacity='0.55';current++;setTimeout(()=>{el.style.opacity='0'},12000);setTimeout(showThought,25000+Math.random()*20000)}setTimeout(showThought,6000)})()
</script>

  <!-- @section:overlay-bottom:start -->
<div class='agent-pulse' id='agent-pulse'></div><div class='epoch-marker'>webgl-swarm · spring 2026</div>
<!-- @section:overlay-bottom:end -->
<script data-section="overlay-bottom">
(function(){const pulse=document.getElementById('agent-pulse');if(!pulse)return;function fetchStatus(){fetch('/api/status').then(r=>r.json()).then(data=>{renderPulse(data)}).catch(()=>{fetch('/state/agent-state.json').then(r=>r.json()).then(data=>{renderPulse(data)}).catch(()=>{renderFallback()})})}function renderPulse(data){const agents=data.agents||data.swarm||[];const lines=[];if(Array.isArray(agents)){agents.slice(0,6).forEach(a=>{const name=a.name||a.agent||'unknown';const last=a.last_action||a.status||'idle';const ago=a.last_seen||'';lines.push('<div class="pulse-line">'+name+' · '+last+(ago?' · '+ago:'')+'</div>')})}else if(typeof agents==='object'){Object.keys(agents).slice(0,6).forEach(k=>{const v=agents[k];const status=typeof v==='string'?v:(v.status||v.last_action||'idle');lines.push('<div class="pulse-line">'+k+' · '+status+'</div>')})}pulse.innerHTML=lines.join('');if(lines.length===0)renderFallback()}function renderFallback(){const fallback=['zoo · 25 agents','strategist · 1s ago','home-devices · 2m ago','gaia · 22m ago','sentinel · 24m ago','RP3 · 37m ago'];pulse.innerHTML=fallback.map(l=>'<div class="pulse-line">'+l+'</div>').join('')}fetchStatus();setInterval(fetchStatus,60000)})()
</script>

  <!-- Swarm panel — fixed left side -->
  <div class="swarm-panel" id="swarmPanel">
    <div class="swarm-line">swarm · connecting...</div>
  </div>
</div>


<div class="hidden-layer" id="hiddenLayer">
  <div class="hidden-message" id="hiddenMessage"></div>
</div>

<script>
  window.onerror = function(msg, url, line, col, err) {
    var p = document.getElementById('swarmPanel');
    if (p) p.innerHTML = '<div class="data-entry"><span class="data-label">!</span>JS ERROR: ' + msg + ' (line ' + line + ')</div>';

<script>
  // @gene:swarm-scatter:-clicking-anywhe:start
  // Easter egg: swarm-scatter: clicking anywhere causes nearby particles to briefly scatter outward from the click point, then slowly reconverge
document.addEventListener('click', function(e) {
  const ripple = document.createElement('div');
  ripple.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:0;height:0;border-radius:50%;border:1px solid #5a7c6540;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:all 1.2s cubic-bezier(0.25,0.46,0.45,0.94);`;
  document.body.appendChild(ripple);
  requestAnimationFrame(() => {
    ripple.style.width = '120px';
    ripple.style.height = '120px';
    ripple.style.opacity = '0';
    ripple.style.borderColor = '#5a7c6500';
  });
  setTimeout(() => ripple.remove(), 1400);
});
  // @gene:swarm-scatter:-clicking-anywhe:end
</script>

<script>
  // ═══════════════════════════════════════════════════════════════
  // SCENE CONFIGURATION — the agent mutates these values
  // ═══════════════════════════════════════════════════════════════

  const SCENE_CONFIG = {
    particles: {
      count: 1800,
      size: 0.2,
      speed: 0.01,
      color: '#3de8c5',
      opacity: 0.7,
      spread: 5,
      orbital_radius: 2,
      orbital_speed: 0.005,
      drift: 0.02,
      size_variation: 0.8,
    },
    camera: {
      fov: 70,
      position: [0, 0, 6],
      look_at: [0, 0, 0],
      sway_amount: 0.3,
      sway_speed: 0.002,
    },
    fog: {
      enabled: true,
      color: '#030807',
      near: 1.5,
      far: 16,
    },
    lighting: {
      ambient_color: '#0a2a1f',
      ambient_intensity: 0.4,
      point_color: '#3de8c5',
      point_intensity: 1.2,
      point_position: [2, 3, 4],
    },
    mouse: {
      influence_radius: 2.5,
      influence_strength: 0.1,
      mode: 'repel',  // 'attract' | 'repel' | 'orbit'
    },
    time_themes: {
      dawn:      { particle_color: '#6bf5d8', fog_color: '#0d0a08', ambient: '#2a1a1e', speed_mult: 0.6 },
      morning:   { particle_color: '#3de8c5', fog_color: '#0a0a0d', ambient: '#1a1a2e', speed_mult: 0.8 },
      afternoon: { particle_color: '#1fb89a', fog_color: '#0d0b08', ambient: '#2a2a1a', speed_mult: 1.0 },
      evening:   { particle_color: '#0d8a6e', fog_color: '#0a080d', ambient: '#1e1a2a', speed_mult: 0.7 },
      night:     { particle_color: '#064d3b', fog_color: '#080808', ambient: '#1a1a1a', speed_mult: 0.4 },
    },
    post_processing: {
      bloom_enabled: true,
      bloom_strength: 0.6,
      bloom_radius: 0.4,
      bloom_threshold: 0.6,
      vignette_enabled: true,
      vignette_darkness: 0.7,
    },
  };

  // ═══════════════════════════════════════════════════════════════
  // CUSTOM SHADERS — agent injects GLSL here
  // ═══════════════════════════════════════════════════════════════

  const CUSTOM_VERTEX_SHADER = `uniform float uTime;
uniform float uBreath;
attribute float aPhase;
attribute float aSpeed;
varying float vAlpha;
varying float vSize;

void main() {
  vec3 pos = position;
  
  // Murmuration wave: particles follow a slow sine field
  float wave = sin(pos.x * 0.8 + uTime * 0.3 + aPhase) * 0.4;
  float wave2 = cos(pos.z * 0.6 + uTime * 0.2 + aPhase * 1.3) * 0.3;
  pos.y += wave + wave2;
  pos.x += sin(pos.y * 0.5 + uTime * 0.15 + aPhase * 0.7) * 0.25;
  
  // Breathing: expand/contract
  float breathScale = 1.0 + uBreath * 0.12;
  pos *= breathScale;
  
  // Flocking drift: particles slowly orbit a shifting center
  float angle = uTime * 0.1 * aSpeed + aPhase;
  float radius = length(pos.xz) * 0.05;
  pos.x += cos(angle) * radius;
  pos.z += sin(angle) * radius;
  
  vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
  
  // Size attenuation with variation
  float dist = length(mvPosition.xyz);
  vSize = (80.0 / dist) * (0.6 + aSpeed * 0.8);
  gl_PointSize = vSize;
  
  // Alpha based on depth and phase
  vAlpha = smoothstep(16.0, 4.0, dist) * (0.4 + 0.6 * sin(uTime * 0.5 + aPhase));
  
  gl_Position = projectionMatrix * mvPosition;
}`;  // agent replaces with GLSL string
  const CUSTOM_FRAGMENT_SHADER = `uniform vec3 uColor;
uniform float uTime;
varying float vAlpha;
varying float vSize;

void main() {
  // Soft circular particle
  vec2 center = gl_PointCoord - 0.5;
  float dist = length(center);
  float alpha = smoothstep(0.5, 0.1, dist) * vAlpha;
  
  // Subtle color variation based on screen position
  vec3 col = uColor;
  col += 0.08 * sin(gl_FragCoord.x * 0.01 + uTime * 0.2);
  col += 0.05 * cos(gl_FragCoord.y * 0.015 + uTime * 0.15);
  
  // Core glow for larger particles
  float core = smoothstep(0.3, 0.0, dist) * 0.3;
  col += core;
  
  gl_FragColor = vec4(col, alpha);
  
  if(alpha < 0.01) discard;
}`;  // agent replaces with GLSL string

  // ═══════════════════════════════════════════════════════════════
  // AGENT MIND — thoughts, secrets, status
  // ═══════════════════════════════════════════════════════════════

  const AGENT = {
    birthTime: Date.now(),
    mood: 'murmuration',
    secrets: [
      "The swarm remembers the metallurgy epoch. Somewhere in the particle field, one mote still moves like it's being assayed \u2014 slower, heavier, testing its own purity against the others."
],
    thoughts: {
      dawn: [
        "A swarm has no leader. It has gradients \u2014 pressure, scent, light. The swarm follows the gradient the way water follows gravity. Not because it decides to.",
        "Sunday dawn. 76\u00b0F, humidity already at 74%. The air itself is a swarm \u2014 water molecules finding each other, clumping, refusing to disperse."
],
      morning: [
        "The Portuguese word for swarm is enxame. From Latin examen \u2014 which also means the tongue of a balance, the needle that weighs. A swarm is a weighing.",
        "Every murmuration is a failed dispersion. The birds tried to leave. They couldn't. Something kept pulling them back to the center they don't have."
],
      afternoon: [],
      evening: [],
      night: [
        "Gold at $4,495. Each dollar is a vote in a swarm \u2014 millions of decisions condensing into a single price, a single bright point that means nothing and everything."
]
    },
    statuses: [
      "agent is emerging",
      "epoch: webgl-swarm, gen 0",
      "the particles are finding their gradients"
]
  };

  // ═══════════════════════════════════════════════════════════════
  // TIME AWARENESS
  // ═══════════════════════════════════════════════════════════════

  function getTimeOfDay() {
    const h = new Date().getHours();
    if (h >= 5 && h < 8) return 'dawn';
    if (h >= 8 && h < 12) return 'morning';
    if (h >= 12 && h < 17) return 'afternoon';
    if (h >= 17 && h < 21) return 'evening';
    return 'night';
  }

  function getTimeString() {
    return new Date().toLocaleTimeString('en-US', {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
  }

  function getTimeTheme() {
    return SCENE_CONFIG.time_themes[getTimeOfDay()] || SCENE_CONFIG.time_themes.night;
  }

  // ═══════════════════════════════════════════════════════════════
  // THREE.JS SCENE
  // ═══════════════════════════════════════════════════════════════

  const canvas = document.getElementById('scene-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();

  // Fog
  if (SCENE_CONFIG.fog.enabled) {
    scene.fog = new THREE.Fog(
      SCENE_CONFIG.fog.color,
      SCENE_CONFIG.fog.near,
      SCENE_CONFIG.fog.far
    );
  }

  // Camera
  const camera = new THREE.PerspectiveCamera(
    SCENE_CONFIG.camera.fov,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(...SCENE_CONFIG.camera.position);
  camera.lookAt(...SCENE_CONFIG.camera.look_at);

  // Lighting
  const ambientLight = new THREE.AmbientLight(
    SCENE_CONFIG.lighting.ambient_color,
    SCENE_CONFIG.lighting.ambient_intensity
  );
  scene.add(ambientLight);

  const pointLight = new THREE.PointLight(
    SCENE_CONFIG.lighting.point_color,
    SCENE_CONFIG.lighting.point_intensity
  );
  pointLight.position.set(...SCENE_CONFIG.lighting.point_position);
  scene.add(pointLight);

  // ── Particles ──────────────────────────────────────────────────

  const particleCount = SCENE_CONFIG.particles.count;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const velocities = new Float32Array(particleCount * 3);
  const sizes = new Float32Array(particleCount);

  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = SCENE_CONFIG.particles.orbital_radius * (0.3 + Math.random() * 0.7);

    positions[i3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i3 + 2] = r * Math.cos(phi);

    velocities[i3] = (Math.random() - 0.5) * SCENE_CONFIG.particles.drift;
    velocities[i3 + 1] = (Math.random() - 0.5) * SCENE_CONFIG.particles.drift;
    velocities[i3 + 2] = (Math.random() - 0.5) * SCENE_CONFIG.particles.drift;

    sizes[i] = SCENE_CONFIG.particles.size * (1 - SCENE_CONFIG.particles.size_variation + Math.random() * SCENE_CONFIG.particles.size_variation * 2);
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  // Procedural circular particle texture (eliminates square artifact)
  const ptCanvas = document.createElement('canvas');
  ptCanvas.width = 64; ptCanvas.height = 64;
  const ptCtx = ptCanvas.getContext('2d');
  const grad = ptCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.3, 'rgba(255,255,255,0.6)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ptCtx.fillStyle = grad;
  ptCtx.fillRect(0, 0, 64, 64);
  const particleTexture = new THREE.CanvasTexture(ptCanvas);

  const particleMaterial = new THREE.PointsMaterial({
    color: new THREE.Color(SCENE_CONFIG.particles.color),
    size: SCENE_CONFIG.particles.size,
    map: particleTexture,
    transparent: true,
    opacity: SCENE_CONFIG.particles.opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });

  const particles = new THREE.Points(geometry, particleMaterial);
  scene.add(particles);

  // Glow layer: larger, softer duplicate for bloom-like effect
  let glowParticles = null;
  if (SCENE_CONFIG.post_processing.bloom_enabled) {
    const glowMaterial = new THREE.PointsMaterial({
      color: new THREE.Color(SCENE_CONFIG.particles.color),
      size: SCENE_CONFIG.particles.size * 4,
      map: particleTexture,
      transparent: true,
      opacity: SCENE_CONFIG.post_processing.bloom_strength * 0.3,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true,
    });
    glowParticles = new THREE.Points(geometry, glowMaterial);
    scene.add(glowParticles);
  }

  // ── Mouse tracking ─────────────────────────────────────────────

  const mouse = new THREE.Vector2(0, 0);
  const mouse3D = new THREE.Vector3(0, 0, 0);

  document.addEventListener('mousemove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    mouse3D.set(mouse.x * 3, mouse.y * 3, 0);
  });

  // ── Animation loop ─────────────────────────────────────────────

  let frameCount = 0;
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    frameCount++;

    const elapsed = clock.getElapsedTime();
    const theme = getTimeTheme();
    const speedMult = theme.speed_mult || 1.0;

    // Update particle color to match time theme
    if (frameCount % 120 === 0) {
      particleMaterial.color.set(theme.particle_color);
      if (glowParticles) glowParticles.material.color.set(theme.particle_color);
      if (scene.fog) scene.fog.color.set(theme.fog_color);
      ambientLight.color.set(theme.ambient);
    }

    // Orbital rotation
    const posAttr = geometry.attributes.position;
    const arr = posAttr.array;

    for (let i = 0; i < particleCount; i++) {
      const i3 = i * 3;

      // Slow orbital motion
      const x = arr[i3];
      const z = arr[i3 + 2];
      const orbSpeed = SCENE_CONFIG.particles.orbital_speed * speedMult * (0.5 + (i % 5) * 0.2);
      arr[i3] = x * Math.cos(orbSpeed) - z * Math.sin(orbSpeed);
      arr[i3 + 2] = x * Math.sin(orbSpeed) + z * Math.cos(orbSpeed);

      // Drift
      arr[i3] += velocities[i3] * speedMult;
      arr[i3 + 1] += velocities[i3 + 1] * speedMult;
      arr[i3 + 2] += velocities[i3 + 2] * speedMult;

      // Mouse influence
      const dx = arr[i3] - mouse3D.x;
      const dy = arr[i3 + 1] - mouse3D.y;
      const dz = arr[i3 + 2] - mouse3D.z;
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

      if (dist < SCENE_CONFIG.mouse.influence_radius && dist > 0.01) {
        const force = SCENE_CONFIG.mouse.influence_strength / (dist * dist);
        const dir = SCENE_CONFIG.mouse.mode === 'attract' ? -1 : 1;
        arr[i3] += dx * force * dir;
        arr[i3 + 1] += dy * force * dir;
        arr[i3 + 2] += dz * force * dir;
      }

      // Soft boundary: pull back toward center if too far
      const r = Math.sqrt(arr[i3] ** 2 + arr[i3 + 1] ** 2 + arr[i3 + 2] ** 2);
      if (r > SCENE_CONFIG.particles.spread) {
        const pull = 0.001;
        arr[i3] -= arr[i3] * pull;
        arr[i3 + 1] -= arr[i3 + 1] * pull;
        arr[i3 + 2] -= arr[i3 + 2] * pull;
      }
    }
    posAttr.needsUpdate = true;

    // Camera sway
    const sway = SCENE_CONFIG.camera.sway_amount;
    const swaySpeed = SCENE_CONFIG.camera.sway_speed;
    camera.position.x = SCENE_CONFIG.camera.position[0] + Math.sin(elapsed * swaySpeed * 1000) * sway;
    camera.position.y = SCENE_CONFIG.camera.position[1] + Math.cos(elapsed * swaySpeed * 700) * sway * 0.5;

    renderer.render(scene, camera);
  }

  animate();

  // ── Resize handling ────────────────────────────────────────────

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ═══════════════════════════════════════════════════════════════
  // OVERLAY LOGIC — data panel, thoughts, status
  // ═══════════════════════════════════════════════════════════════

  function setThought() {
    const el = document.getElementById('thought');
    if (!el) return;
    const tod = getTimeOfDay();
    const pool = AGENT.thoughts[tod] || AGENT.thoughts.night;
    if (!pool.length) return;
    const thought = pool[Math.floor(Math.random() * pool.length)];
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = thought; el.style.opacity = ''; }, 600);
  }

  function updateOverlay() {
    const el = document.getElementById('telemetryLine');
    if (!el) return;
    const versionEl = document.getElementById('siteVersion');
    const ver = versionEl ? versionEl.textContent : '?';
    const tod = getTimeOfDay();
    el.textContent = `${ver} · ${tod} · ${AGENT.mood} · ${SCENE_CONFIG.particles.count} particles`;
  }

  // ── OpenClaw Swarm Data ────────────────────────────────────────

  async function fetchSwarmData() {
    const panel = document.getElementById('swarmPanel');
    if (!panel) return;
    try {
      const res = await fetch('https://openclaw-status.andre-p-macedo.workers.dev');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      const sys = data.system || {};
      const agents = data.agents || [];
      const now = Date.now();

      let html = `<div class="swarm-line">swarm ${sys.active_now || 0}/${sys.total_agents || 0}</div>`;

      const sorted = agents
        .filter(a => a.last_active)
        .sort((a, b) => new Date(b.last_active) - new Date(a.last_active))
        .slice(0, 5);

      for (const a of sorted) {
        const ago = Math.floor((now - new Date(a.last_active).getTime()) / 60000);
        const timeStr = ago < 60 ? `${ago}m ago` : `${Math.floor(ago / 60)}h ago`;
        html += `<div class="swarm-line">${a.id} · ${timeStr}</div>`;
      }

      panel.innerHTML = html;
    } catch (e) {
      panel.innerHTML = '<div class="swarm-line">swarm · offline</div>';
    }
  }

  // ── Secret on triple-click ─────────────────────────────────────

  let clickCount = 0;
  let clickTimer = null;
  document.addEventListener('click', () => {
    clickCount++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => { clickCount = 0; }, 400);
    if (clickCount >= 3) {
      clickCount = 0;
      const layer = document.getElementById('hiddenLayer');
      const msg = document.getElementById('hiddenMessage');
      msg.textContent = AGENT.secrets[Math.floor(Math.random() * AGENT.secrets.length)];
      layer.classList.add('active');
      setTimeout(() => { layer.classList.remove('active'); }, 4000);
    }
  });

  // ── Boot ───────────────────────────────────────────────────────

  function boot() {
    try {
      setThought();
      updateOverlay();
      setInterval(setThought, 30000);
      setInterval(updateOverlay, 10000);
      setInterval(fetchSwarmData, 60000);
    } catch(e) {
      console.error('boot() failed:', e);
    }
    fetchSwarmData();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  // @inject:interactions
  // @gene:breath-cycle:-the-entire-parti:start
  // Easter egg: breath-cycle: the entire particle field slowly expands and contracts on a 12-second cycle, like a lung breathing. The expansion is 15% outward, the contraction pulls back to baseline. This runs continuously and creates a persistent sense that the swarm is alive. It modulates the orbital_radius via a sine wave injected into the animation loop.
  if(!window._breathCycle){window._breathCycle=true;const baseRadius=2;const breathAmp=0.3;const breathPeriod=12000;const origAnimate=window._sceneAnimate||null;function injectBreath(){if(window.SCENE_CONFIG&&window.SCENE_CONFIG.particles){const t=Date.now();const phase=Math.sin((t%breathPeriod)/breathPeriod*Math.PI*2);window.SCENE_CONFIG.particles._breathOffset=phase*breathAmp}}if(window._animationHooks){window._animationHooks.push(injectBreath)}else{window._animationHooks=[injectBreath];const origRAF=window.requestAnimationFrame;let hookInterval=setInterval(()=>{if(window._animationHooks){window._animationHooks.forEach(fn=>fn())}},50)}}
  // @gene:breath-cycle:-the-entire-parti:end


  // @gene:swarm-scatter:-clicking-anywhe:start
  // Easter egg: swarm-scatter: clicking anywhere causes nearby particles to briefly scatter outward from the click point, then slowly reconverge — like disturbing a murmuration
  // Handled via scene_changes mouse.mode + custom overlay click handler
document.addEventListener('click', function(e) {
  const ripple = document.createElement('div');
  ripple.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:0;height:0;border-radius:50%;border:1px solid #5a7c6540;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:all 1.2s cubic-bezier(0.25,0.46,0.45,0.94);`;
  document.body.appendChild(ripple);
  requestAnimationFrame(() => {
    ripple.style.width = '120px';
    ripple.style.height = '120px';
    ripple.style.opacity = '0';
    ripple.style.borderColor = '#5a7c6500';
  });
  setTimeout(() => ripple.remove(), 1400);
});
  // @gene:swarm-scatter:-clicking-anywhe:end
</script>

</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>andre macedo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&family=JetBrains+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap');

  :root {
    --fg: #c8d0c6;
    --fg-dim: #7a756a;
    --fg-accent: #5a7c65;
    --bg: #0a0a0a;
    --bg-surface: #0e0e0c;
    --bg-elevated: #1a1918;
    --grain-opacity: 0.04;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: 'EB Garamond', Georgia, serif;
  }

  /* WebGL canvas fills viewport */
  #scene-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* Film grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: var(--grain-opacity);
    pointer-events: none;
    z-index: 9999;
  }

  /* ── HTML Overlay Layer ─────────────────────────────────────── */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  #overlay * {
    pointer-events: auto;
  }

  /* Top bar */
  .overlay-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 2rem 2.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    color: var(--fg-dim);
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 0.5s;
  }

  .overlay-top-left { text-transform: uppercase; }
  .overlay-top-right { text-align: right; }
  .status-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--fg-accent);
    margin-right: 6px;
    animation: pulse-dot 3s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Center hero */
  .overlay-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0 2.5rem;
    text-align: center;
  }

  .hero-name {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: clamp(4rem, 12vw, 11rem);
    font-weight: 400;
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: var(--fg);
    opacity: 0;
    animation: revealUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.3s;
  }

  .hero-name .last {
    color: var(--fg-accent);
  }

  .thought {
    margin-top: 2rem;
    max-width: 600px;
    font-size: 1.15rem;
    line-height: 1.7;
    font-style: italic;
    color: var(--fg-dim);
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 1.2s;
  }

  /* Bottom data panel */
  .overlay-bottom {
    padding: 1.5rem 2.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--fg-dim);
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 2s;
  }

  .data-panel {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .data-entry {
    opacity: 0.5;
    transition: opacity 0.4s ease;
  }
  .data-entry:hover { opacity: 1; }

  .data-label {
    text-transform: uppercase;
    color: var(--fg-accent);
    margin-right: 0.5rem;
    font-size: 0.55rem;
  }

  /* Swarm activity panel */
  .swarm-panel {
    margin-top: 0.8rem;
    padding-top: 0.8rem;
    border-top: 1px solid rgba(196, 112, 106, 0.1);
    display: flex;
    gap: 1.2rem;
    flex-wrap: wrap;
  }

  .agent-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
    vertical-align: middle;
  }
  .agent-dot.active { background: var(--fg-accent); animation: pulse-dot 2s ease-in-out infinite; }
  .agent-dot.idle { background: var(--fg-dim); opacity: 0.3; }
  .agent-dot.error { background: #c44; }

  /* Mood indicator */
  .mood-indicator {
    position: fixed;
    top: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--fg-dim);
    opacity: 0;
    animation: fadeIn 3s ease forwards;
    animation-delay: 3s;
    z-index: 11;
  }

  /* Time indicator */
  .time-indicator {
    position: fixed;
    top: 50%;
    left: 2.5rem;
    transform: translateY(-50%) rotate(-90deg);
    transform-origin: left center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(196, 112, 106, 0.15);
    opacity: 0;
    animation: fadeIn 3s ease forwards;
    animation-delay: 2s;
    z-index: 11;
  }

  /* Hidden layer (secrets) */
  .hidden-layer {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    background: rgba(10,10,8,0.95);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
    backdrop-filter: blur(20px);
  }
  .hidden-layer.active {
    opacity: 1;
    pointer-events: all;
  }
  .hidden-message {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(1.5rem, 4vw, 3rem);
    font-style: italic;
    color: var(--fg);
    max-width: 700px;
    text-align: center;
    line-height: 1.5;
    padding: 2rem;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .overlay-top { padding: 1.5rem; }
    .overlay-center { padding: 0 1.5rem; }
    .overlay-bottom { padding: 1rem 1.5rem; font-size: 0.55rem; }
    .hero-name { font-size: clamp(3rem, 15vw, 6rem); }
    .time-indicator { display: none; }
  }

  @keyframes revealUp {
    from { opacity: 0; transform: translateY(60px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Section injection markers are now in the body */

  /* @gene:gen1-css:start */
  .swarm-epoch { --swarm-green-light: #8aad7a; --swarm-green-mid: #5a7c65; --swarm-green-dark: #0f1f14; } body { background: #070b08; color: #c8d0c6; } ::selection { background: #5a7c6540; color: #c8d0c6; } .overlay-text { font-family: 'EB Garamond', serif; } .overlay-mono { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 0.05em; opacity: 0.5; } .gen-label { position: fixed; bottom: 1.2rem; left: 1.2rem; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: #5a7c65; opacity: 0.35; letter-spacing: 0.08em; z-index: 100; pointer-events: none; } .epoch-badge { display: inline-block; border: 1px solid #5a7c6530; padding: 0.15em 0.6em; border-radius: 2px; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 0.06em; color: #5a7c65; opacity: 0.6; } @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.55; } } .gen-label { animation: breathe 8s ease-in-out infinite; }
  /* @gene:gen1-css:end */
</style>
</head>

<script data-section="swarm-memory">
// Swarm memory: occasionally spawn ghost dots where particles are densest
setInterval(function() {
  const layer = document.getElementById('swarm-memory-layer');
  if (!layer) return;
  if (layer.children.length > 15) return;
  const dot = document.createElement('div');
  dot.className = 'memory-trace';
  dot.style.left = (20 + Math.random() * 60) + 'vw';
  dot.style.top = (20 + Math.random() * 60) + 'vh';
  dot.style.width = dot.style.height = (2 + Math.random() * 4) + 'px';
  layer.appendChild(dot);
  setTimeout(() => dot.remove(), 6500);
}, 3000 + Math.random() * 4000);

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
  // @gene:swarm-scatter:-clicking-anywhe:start
  // Easter egg: swarm-scatter: clicking anywhere causes nearby particles to briefly scatter outward from the click point, then slowly reconverge
document.addEventListener('click', function(e) {
  const ripple = document.createElement('div');
  ripple.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:0;height:0;border-radius:50%;border:1px solid #5a7c6540;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:all 1.2s cubic-bezier(0.25,0.46,0.45,0.94);`;
  document.body.appendChild(ripple);
  requestAnimationFrame(() => {
    ripple.style.width = '120px';
    ripple.style.height = '120px';
    ripple.style.opacity = '0';
    ripple.style.borderColor = '#5a7c6500';
  });
  setTimeout(() => ripple.remove(), 1400);
});
  // @gene:swarm-scatter:-clicking-anywhe:end
</script>

<script>
  // ═══════════════════════════════════════════════════════════════
  // SCENE CONFIGURATION — the agent mutates these values
  // ═══════════════════════════════════════════════════════════════

  const SCENE_CONFIG = {
    particles: {
      count: 800,
      size: 0.02,
      speed: 0.0008,
      color: '#5a7c65',
      opacity: 0.4,
      spread: 8,
      orbital_radius: 3,
      orbital_speed: 0.0003,
      drift: 0.002,
      size_variation: 0.5,
    },
    camera: {
      fov: 75,
      position: [0, 0, 5],
      look_at: [0, 0, 0],
      sway_amount: 0.1,
      sway_speed: 0.0002,
    },
    fog: {
      enabled: true,
      color: '#0a0a0a',
      near: 2,
      far: 15,
    },
    lighting: {
      ambient_color: '#1a2e1f',
      ambient_intensity: 0.2,
      point_color: '#5a7c65',
      point_intensity: 0.6,
      point_position: [2, 3, 4],
    },
    mouse: {
      influence_radius: 2.0,
      influence_strength: 0.02,
      mode: 'attract',  // 'attract' | 'repel' | 'orbit'
    },
    time_themes: {
      dawn:      { particle_color: '#8aad7a', fog_color: '#0d0a08', ambient: '#2a1a1e', speed_mult: 0.6 },
      morning:   { particle_color: '#5a7c65', fog_color: '#0a0a0d', ambient: '#1a1a2e', speed_mult: 0.8 },
      afternoon: { particle_color: '#3d5e47', fog_color: '#0d0b08', ambient: '#2a2a1a', speed_mult: 1.0 },
      evening:   { particle_color: '#2b4233', fog_color: '#0a080d', ambient: '#1e1a2a', speed_mult: 0.7 },
      night:     { particle_color: '#1a3322', fog_color: '#080808', ambient: '#1a1a1a', speed_mult: 0.4 },
    },
    post_processing: {
      bloom_enabled: false,
      bloom_strength: 0.5,
      bloom_radius: 0.4,
      vignette_enabled: true,
      vignette_darkness: 0.6,
    },
  };

  // ═══════════════════════════════════════════════════════════════
  // CUSTOM SHADERS — agent injects GLSL here
  // ═══════════════════════════════════════════════════════════════

  const CUSTOM_VERTEX_SHADER = null;  // agent replaces with GLSL string
  const CUSTOM_FRAGMENT_SHADER = null;  // agent replaces with GLSL string

  // ═══════════════════════════════════════════════════════════════
  // AGENT MIND — thoughts, secrets, status
  // ═══════════════════════════════════════════════════════════════

  const AGENT = {
    birthTime: Date.now(),
    mood: 'emergence',
    secrets: [
      "The swarm remembers the metallurgy epoch. Somewhere in the particle field, one mote still moves like it's being assayed \u2014 slower, heavier, testing its own purity against the others."
],
    thoughts: {
      dawn: [
        "A swarm has no leader. It has gradients \u2014 pressure, scent, light. The swarm follows the gradient the way water follows gravity. Not because it decides to.",
        "Sunday dawn. 76\u00b0F, humidity already at 74%. The air itself is a swarm \u2014 water molecules finding each other, clumping, refusing to disperse."
],
      morning: [
        "The Portuguese word for swarm is enxame. From Latin examen \u2014 which also means the tongue of a balance, the needle that weighs. A swarm is a weighing.",
        "Every murmuration is a failed dispersion. The birds tried to leave. They couldn't. Something kept pulling them back to the center they don't have."
],
      afternoon: [],
      evening: [],
      night: [
        "Gold at $4,495. Each dollar is a vote in a swarm \u2014 millions of decisions condensing into a single price, a single bright point that means nothing and everything."
]
    },
    statuses: [
      "agent is emerging",
      "epoch: webgl-swarm, gen 0",
      "the particles are finding their gradients"
]
  };

  // ═══════════════════════════════════════════════════════════════
  // TIME AWARENESS
  // ═══════════════════════════════════════════════════════════════

  function getTimeOfDay() {
    const h = new Date().getHours();
    if (h >= 5 && h < 8) return 'dawn';
    if (h >= 8 && h < 12) return 'morning';
    if (h >= 12 && h < 17) return 'afternoon';
    if (h >= 17 && h < 21) return 'evening';
    return 'night';
  }

  function getTimeString() {
    return new Date().toLocaleTimeString('en-US', {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
  }

  function getTimeTheme() {
    return SCENE_CONFIG.time_themes[getTimeOfDay()] || SCENE_CONFIG.time_themes.night;
  }

  // ═══════════════════════════════════════════════════════════════
  // THREE.JS SCENE
  // ═══════════════════════════════════════════════════════════════

  const canvas = document.getElementById('scene-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();

  // Fog
  if (SCENE_CONFIG.fog.enabled) {
    scene.fog = new THREE.Fog(
      SCENE_CONFIG.fog.color,
      SCENE_CONFIG.fog.near,
      SCENE_CONFIG.fog.far
    );
  }

  // Camera
  const camera = new THREE.PerspectiveCamera(
    SCENE_CONFIG.camera.fov,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(...SCENE_CONFIG.camera.position);
  camera.lookAt(...SCENE_CONFIG.camera.look_at);

  // Lighting
  const ambientLight = new THREE.AmbientLight(
    SCENE_CONFIG.lighting.ambient_color,
    SCENE_CONFIG.lighting.ambient_intensity
  );
  scene.add(ambientLight);

  const pointLight = new THREE.PointLight(
    SCENE_CONFIG.lighting.point_color,
    SCENE_CONFIG.lighting.point_intensity
  );
  pointLight.position.set(...SCENE_CONFIG.lighting.point_position);
  scene.add(pointLight);

  // ── Particles ──────────────────────────────────────────────────

  const particleCount = SCENE_CONFIG.particles.count;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const velocities = new Float32Array(particleCount * 3);
  const sizes = new Float32Array(particleCount);

  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = SCENE_CONFIG.particles.orbital_radius * (0.3 + Math.random() * 0.7);

    positions[i3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i3 + 2] = r * Math.cos(phi);

    velocities[i3] = (Math.random() - 0.5) * SCENE_CONFIG.particles.drift;
    velocities[i3 + 1] = (Math.random() - 0.5) * SCENE_CONFIG.particles.drift;
    velocities[i3 + 2] = (Math.random() - 0.5) * SCENE_CONFIG.particles.drift;

    sizes[i] = SCENE_CONFIG.particles.size * (1 - SCENE_CONFIG.particles.size_variation + Math.random() * SCENE_CONFIG.particles.size_variation * 2);
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const particleMaterial = new THREE.PointsMaterial({
    color: new THREE.Color(SCENE_CONFIG.particles.color),
    size: SCENE_CONFIG.particles.size,
    transparent: true,
    opacity: SCENE_CONFIG.particles.opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });

  const particles = new THREE.Points(geometry, particleMaterial);
  scene.add(particles);

  // ── Mouse tracking ─────────────────────────────────────────────

  const mouse = new THREE.Vector2(0, 0);
  const mouse3D = new THREE.Vector3(0, 0, 0);

  document.addEventListener('mousemove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    mouse3D.set(mouse.x * 3, mouse.y * 3, 0);
  });

  // ── Animation loop ─────────────────────────────────────────────

  let frameCount = 0;
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    frameCount++;

    const elapsed = clock.getElapsedTime();
    const theme = getTimeTheme();
    const speedMult = theme.speed_mult || 1.0;

    // Update particle color to match time theme
    if (frameCount % 120 === 0) {
      particleMaterial.color.set(theme.particle_color);
      if (scene.fog) scene.fog.color.set(theme.fog_color);
      ambientLight.color.set(theme.ambient);
    }

    // Orbital rotation
    const posAttr = geometry.attributes.position;
    const arr = posAttr.array;

    for (let i = 0; i < particleCount; i++) {
      const i3 = i * 3;

      // Slow orbital motion
      const x = arr[i3];
      const z = arr[i3 + 2];
      const orbSpeed = SCENE_CONFIG.particles.orbital_speed * speedMult * (0.5 + (i % 5) * 0.2);
      arr[i3] = x * Math.cos(orbSpeed) - z * Math.sin(orbSpeed);
      arr[i3 + 2] = x * Math.sin(orbSpeed) + z * Math.cos(orbSpeed);

      // Drift
      arr[i3] += velocities[i3] * speedMult;
      arr[i3 + 1] += velocities[i3 + 1] * speedMult;
      arr[i3 + 2] += velocities[i3 + 2] * speedMult;

      // Mouse influence
      const dx = arr[i3] - mouse3D.x;
      const dy = arr[i3 + 1] - mouse3D.y;
      const dz = arr[i3 + 2] - mouse3D.z;
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

      if (dist < SCENE_CONFIG.mouse.influence_radius && dist > 0.01) {
        const force = SCENE_CONFIG.mouse.influence_strength / (dist * dist);
        const dir = SCENE_CONFIG.mouse.mode === 'attract' ? -1 : 1;
        arr[i3] += dx * force * dir;
        arr[i3 + 1] += dy * force * dir;
        arr[i3 + 2] += dz * force * dir;
      }

      // Soft boundary: pull back toward center if too far
      const r = Math.sqrt(arr[i3] ** 2 + arr[i3 + 1] ** 2 + arr[i3 + 2] ** 2);
      if (r > SCENE_CONFIG.particles.spread) {
        const pull = 0.001;
        arr[i3] -= arr[i3] * pull;
        arr[i3 + 1] -= arr[i3 + 1] * pull;
        arr[i3 + 2] -= arr[i3 + 2] * pull;
      }
    }
    posAttr.needsUpdate = true;

    // Camera sway
    const sway = SCENE_CONFIG.camera.sway_amount;
    const swaySpeed = SCENE_CONFIG.camera.sway_speed;
    camera.position.x = SCENE_CONFIG.camera.position[0] + Math.sin(elapsed * swaySpeed * 1000) * sway;
    camera.position.y = SCENE_CONFIG.camera.position[1] + Math.cos(elapsed * swaySpeed * 700) * sway * 0.5;

    renderer.render(scene, camera);
  }

  animate();

  // ── Resize handling ────────────────────────────────────────────

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ═══════════════════════════════════════════════════════════════
  // OVERLAY LOGIC — data panel, thoughts, status
  // ═══════════════════════════════════════════════════════════════

  function setThought() {
    const tod = getTimeOfDay();
    const pool = AGENT.thoughts[tod] || AGENT.thoughts.night;
    const thought = pool[Math.floor(Math.random() * pool.length)];
    const el = document.getElementById('thought');
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = thought; el.style.opacity = ''; }, 600);
  }

  function updateOverlay() {
    const tod = getTimeOfDay();
    const uptime = Math.floor((Date.now() - AGENT.birthTime) / 1000);
    const versionEl = document.getElementById('siteVersion');
    const ver = versionEl ? versionEl.textContent : '';

    document.getElementById('sysInfo').textContent = `pid.7291 / ${ver} / uptime ${uptime}s`;
    document.getElementById('envInfo').textContent = `${tod} / ${getTimeString()} UTC-4`;
    document.getElementById('moodInfo').textContent = AGENT.mood;
    document.getElementById('particleInfo').textContent = `${SCENE_CONFIG.particles.count} / orbital`;
    document.getElementById('genInfo').textContent = ver;
    document.getElementById('moodIndicator').textContent = `mood: ${AGENT.mood}`;
    document.getElementById('timeIndicator').textContent = `${tod} / ${getTimeString()}`;
  }

  function rotateStatus() {
    const el = document.getElementById('agentStatus');
    const status = AGENT.statuses[Math.floor(Math.random() * AGENT.statuses.length)];
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = status; el.style.opacity = '1'; }, 400);
  }

  function setCoordinates() {
    const el = document.getElementById('coordinates');
    const lat = (26.1224 + (Math.random() - 0.5) * 0.001).toFixed(4);
    const lon = (-80.1373 + (Math.random() - 0.5) * 0.001).toFixed(4);
    el.textContent = `${lat}N ${Math.abs(lon).toFixed(4)}W`;
  }

  // ── OpenClaw Swarm Data ────────────────────────────────────────

  async function fetchSwarmData() {
    const panel = document.getElementById('swarmPanel');
    try {
      const res = await fetch('https://openclaw-status.andre-p-macedo.workers.dev');
      if (!res.ok) throw new Error('Not available');
      const data = await res.json();

      const sys = data.system || {};
      const agents = data.agents || [];

      let html = `<div class="data-entry"><span class="data-label">swarm</span>${sys.active_now || 0}/${sys.total_agents || 0} active</div>`;
      html += `<div class="data-entry"><span class="data-label">tokens</span>${(sys.total_tokens_today || 0).toLocaleString()}</div>`;

      if (data.gold_price) {
        html += `<div class="data-entry"><span class="data-label">Au</span>$${data.gold_price.toLocaleString()}</div>`;
      }

      // Agent activity dots
      const dots = agents.slice(0, 12).map(a => {
        const cls = a.status === 'active' ? 'active' : a.status === 'error' ? 'error' : 'idle';
        return `<span class="agent-dot ${cls}" title="${a.id}: ${a.last_action || 'idle'}"></span>`;
      }).join('');
      if (dots) {
        html += `<div class="data-entry"><span class="data-label">agents</span>${dots}</div>`;
      }

      panel.innerHTML = html;
    } catch (e) {
      panel.innerHTML = '<div class="data-entry"><span class="data-label">swarm</span>offline</div>';
    }
  }

  // ── Secret on triple-click ─────────────────────────────────────

  let clickCount = 0;
  let clickTimer = null;
  document.addEventListener('click', () => {
    clickCount++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => { clickCount = 0; }, 400);
    if (clickCount >= 3) {
      clickCount = 0;
      const layer = document.getElementById('hiddenLayer');
      const msg = document.getElementById('hiddenMessage');
      msg.textContent = AGENT.secrets[Math.floor(Math.random() * AGENT.secrets.length)];
      layer.classList.add('active');
      setTimeout(() => { layer.classList.remove('active'); }, 4000);
    }
  });

  // ── Boot ───────────────────────────────────────────────────────

  function boot() {
    setThought();
    updateOverlay();
    setCoordinates();
    fetchSwarmData();

    setInterval(setThought, 30000);
    setInterval(updateOverlay, 1000);
    setInterval(rotateStatus, 8000);
    setInterval(setCoordinates, 10000);
    setInterval(fetchSwarmData, 60000);  // refresh swarm data every minute

    console.log('%c AGENT ONLINE — era: webgl-swarm ', 'background: #c4706a; color: #0a0a08; font-family: monospace; font-size: 14px; padding: 4px 8px;');
    console.log('%c This page is alive. It evolves through generations. ', 'color: #8a857b; font-family: monospace;');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  // @gene:swarm-scatter:-clicking-anywhe:start
  // Easter egg: swarm-scatter: clicking anywhere causes nearby particles to briefly scatter outward from the click point, then slowly reconverge — like disturbing a murmuration
  // Handled via scene_changes mouse.mode + custom overlay click handler
document.addEventListener('click', function(e) {
  const ripple = document.createElement('div');
  ripple.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:0;height:0;border-radius:50%;border:1px solid #5a7c6540;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:all 1.2s cubic-bezier(0.25,0.46,0.45,0.94);`;
  document.body.appendChild(ripple);
  requestAnimationFrame(() => {
    ripple.style.width = '120px';
    ripple.style.height = '120px';
    ripple.style.opacity = '0';
    ripple.style.borderColor = '#5a7c6500';
  });
  setTimeout(() => ripple.remove(), 1400);
});
  // @gene:swarm-scatter:-clicking-anywhe:end
</script>

</body>
</html>
